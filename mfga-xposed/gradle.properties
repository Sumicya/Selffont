# AGP 9 default changes this module opts out of. Both are the officially
# documented gradle.properties opt-outs (temporary until AGP 10).
#
# useAndroidX: no AndroidX dependencies here (only the libxposed compileOnly API
# and the JUnit testImplementation for the host-side policy unit tests).
android.useAndroidX=false
# builtInKotlin: AGP 9 turns on built-in Kotlin by default. This module applies
# the standalone org.jetbrains.kotlin.android 2.1.21 plugin instead, so the
# Kotlin toolchain version stays pinned by us rather than following AGP's bundled
# Kotlin. Opt out of the built-in one to avoid two Kotlin plugins fighting.
android.builtInKotlin=false
