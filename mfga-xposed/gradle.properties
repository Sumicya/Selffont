# AGP 9 default this module opts out of (officially documented, temporary
# until AGP 10). No AndroidX dependencies here (only the libxposed compileOnly
# API and the JUnit testImplementation for the host-side policy unit tests).
android.useAndroidX=false
# Built-in Kotlin (AGP 9 default, on) is used to compile src/main/kotlin and
# src/test/kotlin. The standalone org.jetbrains.kotlin.android plugin is NOT
# applied: at 2.1.21 it casts the extension to the removed BaseExtension and
# fails on AGP 9, so we rely on AGP's bundled Kotlin instead.
