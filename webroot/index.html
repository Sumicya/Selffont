<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selffont</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="scripts.js"></script>
</head>
<body>
<main>
  <header><p class="eyebrow">ANDROID 16 · OPLUS · KERNELSU</p><h1>Selffont</h1>
    <p data-i18n="INTRO">统一字体家族，保留粗体、斜体、小型大写和原始文本。</p></header>
  <section><h2 data-i18n="BASELINE">验证基线</h2>
    <p data-i18n="BASELINE_DESC">文渊圆体 v1.010 · Firefox 155.0.1 专项适配待真机验证。命令执行成功不等于网页已使用目标字体。</p>
    <div class="actions"><button data-action="diagnose" data-i18n="DIAGNOSE">只读诊断</button>
      <a href="diagnostics.html" data-i18n="TEST_PAGE">字体对照页</a></div>
  </section>
  <section><h2 data-i18n="MANUAL">手动兜底</h2>
    <p data-i18n="MANUAL_DESC">安装、开机和打开此页面均不会自动执行以下操作。</p>
    <div class="actions"><button data-action="gms" class="danger" data-i18n="GMS">处理 GMS 字体缓存与组件</button></div>
    <p class="note" data-i18n="GMS_WARNING">会停止 Chrome/Gmail、禁用 GMS 字体组件并删除字体缓存。缓存删除不可撤销，组件状态在卸载后仍保留。</p>
    <div class="actions"><button data-action="blockApps" class="danger" data-i18n="BLOCK_APPS">限制阅读应用字体权限</button>
      <button data-action="restoreApps" data-i18n="RESTORE_APPS">恢复记录的应用权限</button></div>
    <p class="note" data-i18n="APPS_WARNING">仅针对用户 0 的番茄小说与起点字体目录；先记录原权限，再修改。操作后请手动重启应用。旧版本未经记录的改动不会被猜测性恢复。</p>
  </section>
  <section><div class="section-heading"><h2 data-i18n="OUTPUT">输出</h2><button id="clear" data-i18n="CLEAR">清空</button><button id="copy" data-i18n="COPY">复制</button></div>
    <pre id="output" role="log" aria-live="polite"></pre></section>
</main>
</body>
</html>
