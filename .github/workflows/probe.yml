# 探针工作流（B 线）：只编 lsp/ 这个独立 Gradle 工程，不跑字体构建的任何脚本。
name: Probe

on:
  push:
    paths:
      - 'lsp/**'
      - '.github/workflows/probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 准备 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      - name: 装编译所需的 SDK 组件
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" >/dev/null
          echo "compileSdk 36 / build-tools 36.0.0 就位"

      - name: 准备 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: 编 APK（debug 签名，可直接装）
        working-directory: lsp
        run: gradle --no-daemon assembleDebug

      - name: 报字节数与 sha256（验收用，原样进日志）
        id: sums
        working-directory: lsp
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          BYTES=$(stat -c %s "$APK")
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "APK=$APK"
          echo "字节数=$BYTES"
          echo "sha256=$SHA"
          echo "bytes=$BYTES" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: SelfFontProbe-dev-1
          path: lsp/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
