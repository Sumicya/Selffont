name: Build Selffont font module
on:
  workflow_dispatch:
  push:
    paths:
      - 'config/**'
      - 'tools/prepare_base.py'
      - 'tools/prepare_font.py'
      - 'tools/build_module.py'
      - 'tools/font_config.py'
      - 'tools/requirements.txt'
      - 'script/**'
      - 'lang/**'
      - 'webroot/**'
      - 'licenses/**'
      - 'fonts.xml'
      - 'fonts_list.yaml'
      - 'LICENSES.md'
      - '.github/workflows/build-module.yml'
permissions:
  contents: read
concurrency:
  group: font-module-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install font inspection tools
        run: python -m pip install -r tools/requirements.txt
      - name: Download and verify pinned original resources
        run: |
          python tools/prepare_font.py
          python tools/prepare_base.py
      - name: Assemble and verify KSU font module
        run: |
          python tools/build_module.py --base build/base/MFGA-base.zip --revision "$GITHUB_SHA"
          python - <<'PY'
          import json
          import pathlib
          import zipfile
          with zipfile.ZipFile('build/Selffont-phase1.zip') as archive:
              report = archive.read('module-report.json')
              pathlib.Path('build/module-report.json').write_bytes(report)
              data = json.loads(report)
              print('Primary font SHA-256:', data['primaryFont']['sha256'])
              print('Supplemental font count:', data['supplementalFontCount'])
              print('Unbundled configuration references:', len(data['unbundledFontReferences']))
              print('Device installation and rendering: NOT TESTED')
          PY
          (cd build && sha256sum Selffont-phase1.zip > Selffont-phase1.zip.sha256)
      - uses: actions/upload-artifact@v7
        with:
          name: selffont-phase1-font-module
          path: |
            build/Selffont-phase1.zip
            build/Selffont-phase1.zip.sha256
            build/module-report.json
          compression-level: 0
          if-no-files-found: error
