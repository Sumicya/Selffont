# 母版直通包：Maruko Gothic 原始字节进 Magisk 模块，只挂载与配置、不改轮廓；用途是给判据当基准。
# 只上传 artifact：不发 Release、不打 tag、不改 latest。出包是内部动作，对外发布要人点头。
# 触发：push 本文件（paths 只盯这一个）或 Actions 页 Run workflow；`gh workflow run` 实测 403。
# 清理按规范：全仓按 created_at 留最新 5 个，母版件也在这 5 个里；产物名 build-<版本>。
name: mother

on:
  push:
    branches: ['**']
    paths: ['.github/workflows/mother.yml']
  workflow_dispatch:
    inputs:
      ref:
        description: '母版提交（maruko-gothic）'
        type: string
        default: '97e9dd4'
      day:
        description: '当日序号（版本号第三段）'
        type: string
        default: '1'

env:
  # 与 docs/metrics.md、README 钉的是同一份：CJK SC 的 Regular，20,084,736 B。
  MOTHER_SHA256: 'e3709389bce13fa75af28cc2370b6175520d97f74dfbf3894ca24838f47241b7'
  MOTHER_NAME: 'MarukoGothicCJKsc-Regular.ttf'
  MOTHER_REF: ${{ inputs.ref || '97e9dd4' }}
  MOTHER_DAY: ${{ inputs.day || '1' }}
  SEGMENTS: '5'
  CLEANUP_APPLY: 'true'


concurrency:
  group: selffont-mother
  cancel-in-progress: false

jobs:
  mother:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read         # 只出 artifact，不发 Release、不打 tag、不改 latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: 恢复 pip 缓存
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-
      - name: 恢复字体缓存
        uses: actions/cache@v5
        with:
          path: build/cache
          key: fonts-v1-${{ runner.os }}
          restore-keys: fonts-v1-
      - name: 安装字体工具
        run: python -m pip install -r requirements.txt
      - name: 取自母版原始字节
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work
          gh api "repos/max32002/maruko-gothic/contents/CJK%20SC/${MOTHER_NAME}?ref=${MOTHER_REF}" \
            -H "Accept: application/vnd.github.raw" > "work/${MOTHER_NAME}"
          size=$(stat -c%s "work/${MOTHER_NAME}")
          sum=$(sha256sum "work/${MOTHER_NAME}" | cut -d' ' -f1)
          echo "尺寸 $size B  sha256 $sum"
          [ "$sum" = "$MOTHER_SHA256" ] || {
            echo "母版字节与钉子不符：母版可能已换包，先核对再出包。" >&2
            exit 1
          }
      - name: 内建自检
        run: python build.py --check
      - name: 出包（母版直通）
        run: |
          set -euo pipefail
          date=$(TZ=Asia/Shanghai date +%y.%-m.%-d)
          # 版本号就按运行号走，不再抬到 90 万：抬 versionCode 是把基准件塞进发行序列，
          # 只解决了「装得下去」，没算「怎么回来」——发行件的总序号是三位数，刷过基准件的机器
          # 会被管理器判成降级，再也装不回正规包。基准件改用独立 id（selffont-bench），
          # 不同 id 各自比较 versionCode，两边互不压制，90 万那套就没有必要了。
          build=${{ github.run_number }}
          name="build-${MOTHER_REF}-${{ github.run_number }}"
          python build.py --passthrough-mother "work/${MOTHER_NAME}" \
            --date "$date" --day "$MOTHER_DAY" --build "$build" --module-id selffont-bench \
            --output "build/${name}.zip"
          echo "NAME=${name}" >> "$GITHUB_ENV"
          echo "DATE=${date}" >> "$GITHUB_ENV"
          echo "BUILD=${build}" >> "$GITHUB_ENV"
      - name: 解包为可直刷目录
        run: |
          set -euo pipefail
          rm -rf build/root
          unzip -oq "build/${NAME}.zip" -d build/root
          test -f build/root/module.prop
          test -f build/root/customize.sh
          # 下载下来的 artifact 就是模块 zip：module.prop 必须在包的根目录，
          # 不能是「zip 里套 zip」。所以上传的是解开的目录内容（build/root），
          # 而不是 build/${NAME}.zip —— 后者下下来还要再解一层，手机上多一步。
          ver=$(sed -n 's/^version=//p' build/root/module.prop)
          echo "VERSION=${ver}" >> "$GITHUB_ENV"
          echo "产物名 build-${ver}"
      - name: 解包验收
        run: |
          set -euo pipefail
          python - <<'PY' | tee build/verify.md
          import hashlib, os, re, zipfile

          name = os.environ["NAME"]
          mother = os.environ["MOTHER_NAME"]
          path = f"build/{name}.zip"
          raw = open(path, "rb").read()
          with zipfile.ZipFile(path) as z:
              names = set(z.namelist())
              prop = z.read("module.prop").decode()
              cjk = z.read(f"system/fonts/{mother}")
              fallback = z.read("font_fallback.xml").decode()
              insert = z.read("fonts-insert.xml").decode()
              fonts = sorted(n for n in names if n.startswith("system/fonts/"))

          from fontTools.ttLib import TTFont
          import io, statistics

          def horiz(blob):
              """包内一件汉字字体的水平度量：字形数、主 advance、非 1000 的字形、lsb≠xMin、墨心偏离中位。"""
              with TTFont(io.BytesIO(blob), lazy=True) as f:
                  cmap, hmtx, glyf = f.getBestCmap(), f["hmtx"], f["glyf"]
                  adv, off, bad, n = {}, [], 0, 0
                  for cp, gname in cmap.items():
                      if not (0x4E00 <= cp <= 0x9FFF or 0x3400 <= cp <= 0x4DBF):
                          continue
                      a, lsb = hmtx[gname]
                      g = glyf[gname]
                      if g.numberOfContours <= 0:
                          continue
                      n += 1
                      adv[a] = adv.get(a, 0) + 1
                      if lsb != getattr(g, "xMin", lsb):
                          bad += 1
                      off.append(abs((g.xMin + g.xMax) / 2 - a / 2))
                  main = max(adv, key=adv.get)
                  return n, main, sum(v for k, v in adv.items() if k != main), bad, statistics.median(off)

          hn, hm, hx, hb, ho = horiz(cjk)
          assert hn > 20000 and hm == 1000, f"母版汉字不是 1000 格：{hn} 字 / 主 advance {hm}"
          assert hb == 0, f"母版 lsb≠xMin {hb} 处"
          # 包里可能还有其他中日韩字件（主字体副本、补充字体）。按汉字字形数取最多的那一件报，
          # 少于 100 个汉字的（音乐符号、Roboto 之类）不是这套水平格的对象，跳过。
          best = (0, "", None)
          with zipfile.ZipFile(path) as z:
              for n_ in fonts:
                  if not n_.lower().endswith((".ttf", ".otf")) or "Maruko" in n_:
                      continue
                  try:
                      got = horiz(z.read(n_))
                  except Exception:
                      continue
                  if got[0] > best[0]:
                      best = (got[0], n_.rsplit("/", 1)[-1], got)
          if best[2] is None or best[0] < 100:
              pn, pm, px, pb, po = 0, 0, 0, 0, 0.0
              primary_name = "（包内无第二件汉字字件）"
          else:
              primary_name = best[1]
              pn, pm, px, pb, po = best[2]

          fields = dict(line.split("=", 1) for line in prop.splitlines() if "=" in line)
          cjk_sum = hashlib.sha256(cjk).hexdigest()
          want = os.environ["MOTHER_SHA256"]
          assert cjk_sum == want, f"包内汉字字件不是母版原字节：{cjk_sum}"
          assert len(cjk) == 20084736, len(cjk)
          assert fallback.count(f">{mother}<") >= 1, "font_fallback.xml 没引用母版字件"
          family = re.search(r"<family name=\"([^\"]+)\"[^>]*>\s*<font[^>]*>%s<" % re.escape(mother), fallback)

          lines = [
              "| 项 | 值 |", "| --- | --- |",
              f"| 包 | `{name}.zip` |",
              f"| 包 sha256 | `{hashlib.sha256(raw).hexdigest()}` |",
              f"| 包大小 | {len(raw):,} B |",
              f"| 版本 | `{fields.get('version')}`（versionCode {fields.get('versionCode')}） |",
              f"| 模块名 | {fields.get('name')} |",
              f"| 说明 | {fields.get('description')} |",
              f"| 汉字字件 | `{mother}` {len(cjk):,} B sha256 `{cjk_sum}` |",
              f"| 与母版原字节一致 | {'是' if cjk_sum == want else '否'} |",
              f"| font_fallback.xml 引用 | {fallback.count(f'>{mother}<')} 处"
              + (f"，族名 `{family.group(1)}`" if family else "") + " |",
              f"| fonts-insert.xml | {sum(1 for l in insert.splitlines() if '<font' in l)} 行 |",
              f"| 包内 /system/fonts 字件 | {len(fonts)} 个 |",
              f"| 水平·母版汉字 | {hn:,} 字，主 advance **{hm}**，非 {hm} 的 {hx} 字，lsb≠xMin {hb} 处，墨心偏离中位 {ho:.1f} |",
              f"| 水平·其次多的汉字字件 `{primary_name}` | {pn:,} 字，主 advance **{pm}**，非 {pm} 的 {px} 字，lsb≠xMin {pb} 处，墨心偏离中位 {po:.1f} |",
              f"| 两件同一格 | {'是' if hm == pm and pn else ('（只有一件，不适用）' if not pn else '否——混排会错位')} |",
          ]
          print("\n".join(lines))
          PY
          cp build/verify.md "$GITHUB_STEP_SUMMARY"
      - name: 存档产物
        uses: actions/upload-artifact@v7
        with:
          # 三类产物的前缀（主人 2026-11-05 第四次强调，不再改）：
          #   build      → 母版 Magisk 模块（本工作流，可直刷）
          #   selffont   → 自研字体的 Magisk 模块（字体还不合格，暂不出）
          #   selfrounds → Selfrounds 字体本身（build.yml 的预览产物）
          name: build-${{ env.VERSION }}
          path: build/root
          retention-days: 30
          if-no-files-found: error
          overwrite: true

  cleanup-artifacts:
    needs: mother
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
      - name: 清理超限产物与运行记录
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CLEANUP_SCOPE: actions
          CLEANUP_APPLY: 'true'          # 缺这一行脚本会按「未交代」直接退出（实测 exit 1）
        run: python3 .github/scripts/cleanup.py
