# 字体工作流：只出 selfrounds-*（Selfrounds 字体文件本身，不是模块）。不发 Release、不打 tag。
name: selfrounds

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'bad/**'
      - 'lsp/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

env:
  SEGMENTS: '5'
  CLEANUP_APPLY: 'true'

concurrency:
  group: selffont-selfrounds
  cancel-in-progress: false

jobs:
  selfrounds:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: 恢复 pip 缓存
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-
      - name: 恢复字体缓存
        uses: actions/cache@v5
        with:
          path: build/cache
          key: fonts-v1-${{ runner.os }}
          restore-keys: fonts-v1-
      - name: 安装字体工具
        run: python -m pip install -r requirements.txt
      - name: 内建自检
        run: python build.py --check
      - name: 出预览字体
        run: |
          set -euo pipefail
          echo "SHA8=${GITHUB_SHA::8}" >> "$GITHUB_ENV"
          python build.py --preview '鬱響鬢Ay?' --preview-out build/preview
          ls -l build/preview
      - name: 上传 selfrounds
        uses: actions/upload-artifact@v7
        with:
          name: selfrounds-${{ env.SHA8 }}
          path: build/preview
          retention-days: 3
          if-no-files-found: error
          overwrite: true

  cleanup-artifacts:
    needs: selfrounds
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
      - name: 清理超限产物与运行记录
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CLEANUP_SCOPE: actions
        run: python3 .github/scripts/cleanup.py
