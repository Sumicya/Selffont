# 字体工作流：只出 selfrounds-*（Selfrounds 字体文件本身，不是模块）。不发 Release、不打 tag。
name: selfrounds

# 冻结：自研字体还没合格（跑的不是五条判据门禁，只拿四个字画预览图），
# 不许随 push 自动出包。落地方式就是这一行：只留 workflow_dispatch。
on:
  workflow_dispatch:

env:
  SEGMENTS: '5'
  CLEANUP_APPLY: 'true'

concurrency:
  group: selffont-selfrounds
  cancel-in-progress: false

jobs:
  selfrounds:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: 恢复 pip 缓存
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-
      - name: 恢复字体缓存
        uses: actions/cache@v5
        with:
          path: build/cache
          key: fonts-v1-${{ runner.os }}
          restore-keys: fonts-v1-
      - name: 安装字体工具
        run: python -m pip install -r requirements.txt
      - name: 内建自检
        run: python build.py --check
      - name: 出预览字体（只有几个样字，不是完整字体）
        run: |
          set -euo pipefail
          # 这里只画几个样字看图，**不是**合格的完整字体出包。字体合格前只留手动触发。
          python build.py --preview '鬱響鬢Ay?' --preview-out build/preview
          ls -l build/preview
      - name: 取版本号（五段，不带 SHA）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 号源与 build.yml 同一套实现（tools/ci_version.py），只是读自己这条工作流的运行列表。
          VERSION=$(python3 tools/ci_version.py --workflow selfrounds.yml)
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "产物名 selfrounds-${VERSION}"
      - name: 上传 selfrounds
        uses: actions/upload-artifact@v7
        with:
          name: selfrounds-${{ env.VERSION }}
          path: build/preview
          retention-days: 3
          if-no-files-found: error
          overwrite: true

  cleanup-artifacts:
    needs: selfrounds
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
      - name: 清理超限产物与运行记录
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CLEANUP_SCOPE: actions
        run: python3 .github/scripts/cleanup.py
