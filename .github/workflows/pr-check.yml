name: PR check
# 独立的 PR 校验工作流：只接 pull_request，只读权限，不取号、不出包、不上传、不清理。
#
# 拆出这个文件的原因（规范明令、外仓实测过真事故）：run_number 在运行创建的那一刻就由
# GitHub 分配，跟工作流文件里有没有步骤级 if 无关——哪怕出包步骤写了
# `if: github.event_name != 'pull_request'` 把步骤跳过,触发运行这件事本身仍然吃掉了一个
# run_number。只要 push 和 pull_request 两种事件共用同一个工作流文件，同一个提交被两边
# 同时触发时就会各吃一个号，总序号段必然留洞、乱跳。唯一堵得住的办法是让 pull_request
# 完全走另一个工作流文件：它有自己独立的 run_number 序列，build.py 从不读它、从不用它算
# 总序号，PR 运行再多也不会影响出包工作流（build.yml）的号段。
on:
  pull_request:
env:
  SEGMENTS: "5"   # 跟 build.yml 保持同一个值,预演判据才对得上真删
permissions:
  contents: read
jobs:
  selfcheck:
    name: Selfcheck (packager, metric normalization, module scripts)
    runs-on: ubuntu-24.04   # 钉住版本,不用 ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install fonttools
        run: python -m pip install -r requirements.txt
      - name: Selfcheck (packager, metric normalization, module scripts)
        run: python build.py --check
  cleanup-preview:
    name: Cleanup preview (预演,只打印不删)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read   # 只读,不申请 write——这个 job 不删任何东西
    steps:
      - uses: actions/checkout@v7
      # 跟 build.yml 的 cleanup job 共用同一份 .github/scripts/cleanup.py,CLEANUP_APPLY=false
      # 时脚本只打印判据结论与将删名单,不调用 DELETE。出包工作流只在 push(限默认分支)与
      # workflow_dispatch 触发,会话分支推送碰不到它,会话令牌也没有 actions: write 去手动
      # dispatch——这个预演 job 是会话侧唯一够得着的真机证据,不是真删的替代品。
      - name: 清理判据预演（口径 / 来源 / 重复当日序号 / 数量，均只打印）
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP: "5"
          SEGMENTS: ${{ env.SEGMENTS }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CLEANUP_APPLY: "false"
        run: python3 .github/scripts/cleanup.py
