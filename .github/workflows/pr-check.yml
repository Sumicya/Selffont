name: PR check
# 独立的 PR 校验工作流：只接 pull_request，selfcheck job 只读、不取号、不出包、不上传；
# cleanup job 真删（见下）。
#
# 拆出这个文件的原因（2026-10-14 号源从 run_number 改成 git 提交数之前）：run_number 在运行
# 创建的那一刻就由 GitHub 分配，跟工作流文件里有没有步骤级 if 无关——哪怕出包步骤写了
# `if: github.event_name != 'pull_request'` 把步骤跳过,触发运行这件事本身仍然吃掉了一个
# run_number；只要 push 和 pull_request 两种事件共用同一个工作流文件，同一个提交被两边
# 同时触发时就会各吃一个号，总序号段必然留洞、乱跳。
#
# 号源改成提交数后（GLOBAL.md 240a214/c5ac12d）这条理由本身不再成立——build.py 只读本地 git
# 历史，PR 运行不触碰它，不会吃号——但拆分依然必须保留，换了理由：同一提交若让 push 与
# pull_request 共用一个工作流文件，两边各出一次包会产出两个同名 artifact，撞名互相覆盖、
# 清理还会把它们判成「重复当日序号」；而且会话可达的清理真删要挂在 pull_request 触发上
# （见下），出包与校验职责分离本身也要求两个文件。build.py 从不读这个工作流的运行记录。
#
# 2026-10-14 教训：这个文件的 cleanup job 曾经是只读预演（actions: read，CLEANUP_APPLY=false），
# 真删只挂在 build.yml 上——但 build.yml 只在 push(限默认分支)/workflow_dispatch 触发，会话
# 既不推默认分支、令牌又没有 actions: write 去手动 dispatch，导致真删在会话侧永远等不到，待删
# 对象能挂几个小时一次都没删。实测同仓分支发起的 pull_request 事件里 GITHUB_TOKEN 能拿到工作流
# 声明的权限（不是 fork 才只读），所以把真删也挂到这里：会话推送到同仓开的 PR 就会触发，
# 五个条件判据（口径/来源/重复当日序号/号源口径/数量）照常算，DELETE 失败按返回码分两条路：
# 403 这类权限缺口（典型是 fork PR）打 warning 降级为预演并继续，不让 job 红；403 以外的失败
# （脚本异常、端点错误等）打 error 并让 job 当轮变红，不许也降成 warning 蒙过去（见 cleanup.py）。
#
# 2026-10-15 加第五条判据「号源口径」（GLOBAL.md 129a292）：cleanup job 的 checkout 同样要
# fetch-depth: 0（见下），否则 git rev-list --count <head sha> 在浅克隆下取不到数,这条判据会
# 对所有候选都判「不可核验」而失效。
on:
  pull_request:
env:
  SEGMENTS: "5"   # 跟 build.yml 保持同一个值,两处判据才算的是同一套口径
permissions:
  contents: read
jobs:
  selfcheck:
    name: Selfcheck (packager, metric normalization, module scripts)
    runs-on: ubuntu-24.04   # 钉住版本,不用 ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install fonttools
        run: python -m pip install -r requirements.txt
      - name: Selfcheck (packager, metric normalization, module scripts)
        run: python build.py --check
  cleanup:
    name: Cleanup (五判据真删)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write   # 真删 artifact/run;pull_request 事件里这个权限对同仓 PR 真实生效,
                       # 对 fork 发起的 PR 仍然只读,DELETE 会 403,脚本按 403 降级打 warning;
                       # 403 以外的删除失败（脚本异常、端点错误等）这个 job 当轮变红
    concurrency:
      group: selffont-artifacts   # 跟 build.yml 的 cleanup job 同一个 group,两处真删串行
      cancel-in-progress: false
    steps:
      # 号源口径判据要本地 git rev-list --count <head sha>,浅克隆下目标 sha 可能不在本地历史里。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # 跟 build.yml 的 cleanup job 共用同一份 .github/scripts/cleanup.py,CLEANUP_APPLY=true,
      # 判定即执行删除。会话推送到同仓发起的 PR（不是 fork）就会触发,不用等 build.yml 的下一次
      # push/workflow_dispatch；DELETE 失败按返回码分两条路（见 cleanup.py 的 act()）：403 这类
      # 权限缺口打 warning 降级为预演继续,不让这个 job 变红;403 以外的失败让 job 当轮变红。
      - name: Cleanup (五判据真删)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP: "5"
          SEGMENTS: ${{ env.SEGMENTS }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CLEANUP_APPLY: "true"
        run: python3 .github/scripts/cleanup.py
