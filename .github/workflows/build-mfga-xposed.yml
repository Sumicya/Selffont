name: Build Selffont diagnostic APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'mfga-xposed/**'
      - 'tests/java/**'
      - 'tests/run_java.sh'
      - '.github/workflows/build-mfga-xposed.yml'
  pull_request:
    paths:
      - 'mfga-xposed/**'
      - '.github/workflows/build-mfga-xposed.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test pure policies
        run: sh tests/run_java.sh
      - name: Build installable diagnostic APK
        working-directory: mfga-xposed
        run: gradle --no-daemon assembleDebug --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: selffont-phase1-debug-apk
          path: mfga-xposed/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
