# 自版工作流：只出 selffont-*（自研字体打成的 Magisk 模块）。字体不合格，冻结中，默认不出：手动触发或提交信息带 [selffont] 才跑。
name: selffont

# 冻结的落地方式就是这一行：**只留 workflow_dispatch，不挂 push**。
# 上一版想用 job 级 if 挡 push（提交信息带 [selffont] 才跑），实测没挡住——
# 2026-11-06 21:20Z 那次 push 的提交信息里没有 [selffont]，job 照样起来了，
# 一路跑到「内建自检」，那是一次 53 分钟的全量构建，白烧。
# 表达式能不能挡住不是靠推的，所以改成结构上根本触发不了：想出自版，去 Actions 点按钮。
on:
  workflow_dispatch:

env:
  SEGMENTS: '5'
  CLEANUP_APPLY: 'true'
  CI_WORKFLOW: 'selffont.yml'

concurrency:
  group: selffont-selffont
  cancel-in-progress: false

jobs:
  selffont:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      statuses: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: 恢复 pip 缓存
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-
      - name: 恢复字体缓存
        uses: actions/cache@v5
        with:
          path: build/cache
          key: fonts-v1-${{ runner.os }}
          restore-keys: fonts-v1-
      - name: 安装字体工具
        run: python -m pip install -r requirements.txt
      - name: 内建自检
        run: python build.py --check
      - name: 取号并出包
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          python build.py --query-ci 2>&1 | tee build.log
      - name: 失败时把日志尾巴报成注解
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ ! -f build.log ]; then
            echo "::error title=build.log::没有 build.log"
            exit 0
          fi
          tail -n 6 build.log | while IFS= read -r line; do
            echo "::error title=build.log::${line}"
          done
          desc=$(tail -n 1 build.log | cut -c1-120)
          gh api -X POST "repos/${REPO}/statuses/${GITHUB_SHA}" \
            -f state=failure -f context=build-log -f description="$desc" >/dev/null || true
      - name: 失败时把日志写进运行摘要
        if: failure()
        run: |
          {
            echo '### build.log 末尾 120 行'
            echo '```'
            if [ -f build.log ]; then tail -n 120 build.log; else echo '（没有 build.log）'; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 失败时上传构建日志
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: log-${{ github.run_id }}
          path: build.log
          retention-days: 2
          if-no-files-found: error
          overwrite: true
      - name: 确认产物名
        run: |
          set -euo pipefail
          zip_file=$(basename "$(find build -maxdepth 1 -name 'selffont-*.zip' -print -quit)")
          test -n "$zip_file"
          name="${zip_file%.zip}"
          echo "$name" | grep -Eq '^selffont-[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}\.[0-9]+\.[0-9]+$' || {
            echo "产物名不是五段规范版本：$name" >&2
            exit 1
          }
          echo "ARTIFACT_NAME=$name" >> "$GITHUB_ENV"
          echo "VERSION=${name#selffont-}" >> "$GITHUB_ENV"
      - name: 解包为可直刷目录
        run: |
          set -euo pipefail
          rm -rf build/root
          unzip -oq "build/${ARTIFACT_NAME}.zip" -d build/root
          test -f build/root/module.prop
          test -f build/root/customize.sh
      - name: 记录产物哈希
        run: |
          set -euo pipefail
          sum=$(sha256sum "build/${ARTIFACT_NAME}.zip" | cut -d' ' -f1)
          echo "$sum  ${ARTIFACT_NAME}.zip" > build/SHA256SUMS.txt
          cp build/SHA256SUMS.txt build/root/SHA256SUMS.txt
          echo "sha256=$sum  ${ARTIFACT_NAME}.zip"
      - name: 上传自版模块
        uses: actions/upload-artifact@v7
        with:
          name: selffont-${{ env.VERSION }}
          path: build/root
          retention-days: 5
          if-no-files-found: error
          overwrite: true

  cleanup-artifacts:
    needs: selffont
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
      - name: 清理超限产物与运行记录
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CLEANUP_SCOPE: actions
        run: python3 .github/scripts/cleanup.py
