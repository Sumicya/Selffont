name: Build
# 出包工作流，唯一号源：只接 push（限默认分支 main）与 workflow_dispatch。
# pull_request 固定走独立的 pr-check.yml——不是靠这边的步骤级 if 挡,是两个工作流文件各有
# 独立的 run_number 序列,PR 事件物理上碰不到这个文件的号段(真实根因与教训见该文件顶部注释)。
# 会话分支要验证取数/出包逻辑用 workflow_dispatch 手动触发,不允许靠推送会话分支触发出包
# ——调试 CI 的推送不该吃号,push 触发器只认默认分支。
on:
  push:
    branches: [ main ]
  workflow_dispatch:
env:
  SEGMENTS: "5"   # 当前版本号段数(正常五段);真要退化成四段的时期,把这改成 4 并在 AGENTS.md 写明原因
permissions:
  contents: read
  actions: read          # 只为读本工作流的运行历史算版本号,不写
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Selfcheck / build / upload artifact
    runs-on: ubuntu-24.04   # 钉住版本,不用 ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install fonttools
        run: python -m pip install -r requirements.txt
      - name: Selfcheck (packager, metric normalization, module scripts)
        run: python build.py --check
      # 版本号在这一处算定:build.py --query-github 锚定本次运行(GITHUB_RUN_ID / GITHUB_RUN_NUMBER),
      # 不拿查询时的最新运行冒充本次;重试用同一身份,版本自然复用。取不到数就停,不出包不上传。
      # 本工作流不接 pull_request 事件(见上方 on:),到这一步时一定是 push(仅 main)或
      # workflow_dispatch,不需要再用步骤级 if 挡——PR 校验在独立的 pr-check.yml 里跑。
      - name: Build (version stamped)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python build.py --query-github
      # 出包前核对命名一致性:产物名与 artifact 名统一 Selffont-<版本>,不合规范就不上传。
      # 版本允许五段(yy.m.d.当日序号.总序号)或当日序号取不到时退化的四段(yy.m.d.总序号)——
      # 跟 build.py 的 VERSION_RE / VERSION_RE4 保持同一套正则,别只认五段把合法的退化包拦下来。
      - name: Stage artifact name (Selffont-<版本>)
        run: |
          zip_file=$(basename "$(find build -maxdepth 1 -name 'Selffont*.zip' -print -quit)")
          test -n "$zip_file"
          ls -l "build/$zip_file"
          name="${zip_file%.zip}"
          echo "$name" | grep -Eq '^Selffont-[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}\.[0-9]+(\.[0-9]+)?$' || {
            echo "产物名不符合规范的版本格式(五段或退化四段):$name" >&2
            exit 1
          }
          echo "ARTIFACT_NAME=$name" >> "$GITHUB_ENV"
      # 包直出:artifact 本身就是可刷的模块包,不再 zip 套 zip——网页下载下来直接给管理器刷,
      # 不用先解一层。upload-artifact 会把搜索路径的最近公共祖先当作包内根目录(官方 README),
      # 所以上传目录内容 = 包内根就是 module.prop。代价:gh run download 会把内容摊进目标目录,
      # 用 -D 指定一个空目录。
      - name: Unpack for direct-flash artifact
        run: |
          rm -rf build/root
          unzip -q "build/${ARTIFACT_NAME}.zip" -d build/root
          test -f build/root/module.prop
          test -f build/root/customize.sh
          find build/root -maxdepth 1 | sort
      # CI 出包(不是发版):只有 push(仅 main)与 workflow_dispatch 传,名 = <项目名>-<版本>,
      # 留 5 天兜底;PR 校验在独立的 pr-check.yml 里跑,这个工作流根本收不到 pull_request 事件。
      # 上传用 runner 自带令牌,不需要写权限。Release / tag / 正式 asset 一概不碰。
      - name: Upload module (Actions artifact)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: build/root
          retention-days: 5
          if-no-files-found: error
  cleanup:
    name: Clean up by quantity / naming / source (三条判据)
    needs: build
    # 写权限只给可信的默认分支构建 job(规范:清理 job 权限最小化,只删本项目对象)。本工作流
    # 不接 pull_request,这里只按 ref 再做一道保险:非默认分支(如会话分支用 workflow_dispatch
    # 触发出包)不给这个 job 写权限、不跑清理——它们出的对象在下一次 main 构建时由这个 job
    # 按下面三条判据收口,清理责任固定在这里,不经会话令牌、不经人工。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write        # 只删 Actions artifact 与 run;contents 保持只读,不碰 Release / tag
    concurrency:
      group: selffont-artifacts
      cancel-in-progress: false
    steps:
      - name: Delete by quantity (day-exempt) / naming (SEGMENTS) / source (pull_request)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP: "5"
          SEGMENTS: ${{ env.SEGMENTS }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          from datetime import datetime, timedelta, timezone

          CLOCK = timezone(timedelta(hours=8))

          keep_raw = os.environ["KEEP"].strip()
          if not keep_raw.isdigit() or int(keep_raw) < 1:
              sys.exit(f"KEEP 必须是正整数,收到 {keep_raw!r}")
          keep = int(keep_raw)
          segments_raw = os.environ["SEGMENTS"].strip()
          if not segments_raw.isdigit() or int(segments_raw) < 1:
              sys.exit(f"SEGMENTS 必须是正整数,收到 {segments_raw!r}")
          segments = int(segments_raw)
          repo = os.environ["REPO"]
          current_run_id = int(os.environ["CURRENT_RUN_ID"])

          def api(path, jq=None, method=None):
              command = ["gh", "api"] + (["--jq", jq] if jq else []) + (["-X", method] if method else []) + [path]
              result = subprocess.run(command, capture_output=True, text=True)
              if result.returncode != 0:
                  sys.exit(f"gh api {path} 失败:{result.stderr.strip()}")
              return result.stdout

          def parse_time(value):
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          def today_start():
              """当天(UTC+8)零点,换算回 UTC,跟 created_at 比。"""
              now = datetime.now(CLOCK)
              return now.replace(hour=0, minute=0, second=0, microsecond=0).astimezone(timezone.utc)

          START = today_start()
          repo_id = int(json.loads(api(f"repos/{repo}", jq="{id: .id}"))["id"])

          def paginate(path_tpl, jq):
              rows, page = [], 1
              while True:
                  batch = [json.loads(line) for line in
                           api(f"{path_tpl}&page={page}" if "?" in path_tpl else f"{path_tpl}?per_page=100&page={page}",
                               jq=jq).splitlines() if line.strip()]
                  if not batch:
                      return rows
                  rows += batch
                  page += 1

          # ---- 两个工作流的运行记录,按 id 建事件映射(artifact 的"来源"判据要用) ----
          def workflow_runs(workflow):
              return paginate(f"repos/{repo}/actions/workflows/{workflow}/runs?per_page=100",
                               ".workflow_runs[]|{id,run_number,status,event,created_at}")

          build_runs = workflow_runs("build.yml")
          try:
              prcheck_runs = workflow_runs("pr-check.yml")
          except SystemExit:
              prcheck_runs = []  # 这个工作流文件在 main 上还没有任何运行记录时,接口会 404

          event_by_run_id = {row["id"]: row["event"] for row in build_runs + prcheck_runs}

          # ---- artifact:三条判据,口径与来源两条不豁免当日 ----
          def artifacts():
              """完整分页取 artifact;名字前缀只用于筛候选,归属另按运行记录核验。"""
              return paginate("repos/{}/actions/artifacts?per_page=100".format(repo),
                               ".artifacts[]|{id,name,created_at,size_in_bytes,workflow_run}")

          def owned(row):
              run = row.get("workflow_run") or {}
              return run.get("repository_id") == repo_id and run.get("head_repository_id") == repo_id

          def name_segments(name):
              """Selffont-26.10.14.4.119 -> 版本部分按 . 切出来的段数。"""
              version = name.split("-", 1)[1] if "-" in name else ""
              return len([part for part in version.split(".") if part])

          rows = [row for row in artifacts() if row["name"].lower().startswith("selffont-")]
          unknown = [row for row in rows if not owned(row)]
          rows = [row for row in rows if owned(row)]
          for row in unknown:
              print(f"归属不明(保留) {row['created_at']} {row['name']} id={row['id']} workflow_run={row.get('workflow_run')}")

          def is_current(row):
              run = row.get("workflow_run") or {}
              return run.get("id") == current_run_id

          criteria_victims = []
          for row in rows:
              if is_current(row):
                  continue  # 不碰本次运行刚上传的 artifact
              reasons = []
              if name_segments(row["name"]) != segments:
                  reasons.append(f"口径(段数={name_segments(row['name'])}≠SEGMENTS={segments})")
              run_event = event_by_run_id.get((row.get("workflow_run") or {}).get("id"))
              if run_event == "pull_request":
                  reasons.append("来源(pull_request)")
              if reasons:
                  criteria_victims.append((row, reasons))

          for row, reasons in criteria_victims:
              print(f"DELETE(判据:{' + '.join(reasons)}) {row['created_at']} {row['name']} id={row['id']}")
              api(f"repos/{repo}/actions/artifacts/{row['id']}", method="DELETE")

          survivors = [row for row in rows if row["id"] not in {r["id"] for r, _ in criteria_victims}]
          non_today = sorted((row for row in survivors if parse_time(row["created_at"]) < START),
                             key=lambda row: row["created_at"], reverse=True)
          today_rows = [row for row in survivors if parse_time(row["created_at"]) >= START]
          qty_victims = non_today[keep:]
          print(f"artifact:判据删 {len(criteria_victims)} 个;当日 {len(today_rows)} 个(数量不设上限,不删);"
                f"非当日 {len(non_today)} 个,保留最近 {keep} 个")
          for row in qty_victims:
              print(f"DELETE(判据:数量) {row['created_at']} {row['name']} id={row['id']}")
              api(f"repos/{repo}/actions/artifacts/{row['id']}", method="DELETE")

          left = [row for row in artifacts() if row["name"].lower().startswith("selffont-") and owned(row)]
          left_non_today = [row for row in left if parse_time(row["created_at"]) < START]
          print(f"复核:本项目 artifact 剩 {len(left)} 个,其中非当日 {len(left_non_today)} 个(上限 {keep})")
          if len(left_non_today) > keep:
              sys.exit(f"清理后非当日 artifact 仍有 {len(left_non_today)} 个,超过上限 {keep}")

          releases = json.loads(api(f"repos/{repo}/releases", jq="length"))
          print(f"Release 数:{releases}(规范上限 1。CI 不发版也不删 Release;"
                "获准人工发布时由发布者做发布后清理)")
          if releases > 1:
              print("WARNING: Release 超过 1 个,需要获准的人工操作清理(CI 无 contents 写权限)")

          # ---- 运行记录:build.yml 与 pr-check.yml 各一条序列,数量判据,当日豁免,清理只留这一处 ----
          def clean_runs(workflow, rows):
              non_today_runs = sorted((row for row in rows if parse_time(row["created_at"]) < START),
                                      key=lambda row: row["run_number"], reverse=True)
              today_count = len(rows) - len(non_today_runs)
              victims = [row for row in non_today_runs[keep:]
                        if row["status"] != "in_progress" and row["id"] != current_run_id]
              print(f"{workflow}:{len(rows)} 条运行记录,当日 {today_count} 条(不设上限),"
                    f"非当日 {len(non_today_runs)} 条,保留最近 {keep} 条")
              for row in victims:
                  print(f"DELETE RUN({workflow}) {row['created_at']} run_number={row['run_number']} id={row['id']}")
                  api(f"repos/{repo}/actions/runs/{row['id']}", method="DELETE")
              left_rows = workflow_runs(workflow)
              left_non_today = [row for row in left_rows if parse_time(row["created_at"]) < START]
              print(f"{workflow}:复核剩 {len(left_rows)} 条,非当日 {len(left_non_today)} 条(上限 {keep})")
              if len(left_non_today) > keep:
                  sys.exit(f"{workflow} 清理后非当日运行记录仍有 {len(left_non_today)} 条,超过上限 {keep}")

          clean_runs("build.yml", build_runs)
          if prcheck_runs:
              clean_runs("pr-check.yml", prcheck_runs)
          else:
              print("pr-check.yml:目前没有任何运行记录(还没有 PR 触发过),无需清理")
          PY
