# 母版工作流：只出 build-*（Maruko 原字节进 Magisk 模块，只做水平定位归位，不改轮廓）。
# 验收通过后挂 Release（tag = 五段版本，`--target` 钉在产出它的那个提交上）：这是唯一公开下载地址，
# artifact 要登录、三十天过期，手机上等于没有。旧版由 cleanup-releases 收，全仓只留一个。
name: build

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'bad/**'
      - 'lsp/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

env:
  SEGMENTS: '5'
  CLEANUP_APPLY: 'true'
  MOTHER_SHA256: 'e3709389bce13fa75af28cc2370b6175520d97f74dfbf3894ca24838f47241b7'
  MOTHER_NAME: 'MarukoGothicCJKsc-Regular.ttf'
  MOTHER_REF: '97e9dd4'

concurrency:
  group: selffont-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      statuses: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: 恢复 pip 缓存
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-
      - name: 恢复字体缓存
        uses: actions/cache@v5
        with:
          path: build/cache
          key: fonts-v1-${{ runner.os }}
          restore-keys: fonts-v1-
      - name: 安装字体工具
        run: python -m pip install -r requirements.txt
      - name: 内建自检
        run: python build.py --check
      - name: 取自母版原始字节
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build work
          gh api "repos/max32002/maruko-gothic/contents/CJK%20SC/${MOTHER_NAME}?ref=${MOTHER_REF}" \
            -H "Accept: application/vnd.github.raw" > "work/${MOTHER_NAME}"
          sum=$(sha256sum "work/${MOTHER_NAME}" | cut -d' ' -f1)
          echo "尺寸 $(stat -c%s "work/${MOTHER_NAME}") B  sha256 $sum"
          [ "$sum" = "$MOTHER_SHA256" ] || {
            echo "母版字节与钉子不符：母版可能已换包，先核对再出包。" >&2
            exit 1
          }
      - name: 修水平定位（只平移，不缩放、不改轮廓）
        run: |
          set -euo pipefail
          # 母版 27,559 个汉字全是 1000 宽的字格，但墨迹不都落在格子中间：满格字里 10.3%
          # 的墨心偏离 500 超过 20 单位（=2% em），最远 ±54.5；且整体偏左。
          # 只做一件事：整字沿 x 平移，让墨心落到 500。轮廓相对彼此一个点不动。
          # 输出保持原文件名：包内字件名与 fonts.xml 的引用都靠它。
          mkdir -p build work/hpos
          python tools/fix_hpos.py "work/${MOTHER_NAME}" -o "work/hpos/${MOTHER_NAME}" \
            | tee build/hpos.md
          cp build/hpos.md "$GITHUB_STEP_SUMMARY"
      - name: 出包（母版 + 水平定位修正）
        run: |
          set -euo pipefail
          date=$(TZ=Asia/Shanghai date +%y.%-m.%-d)
          name="build-${MOTHER_REF}-${{ github.run_number }}"
          python build.py --passthrough-mother "work/hpos/${MOTHER_NAME}" \
            --date "$date" --day 1 --build "${{ github.run_number }}" --module-id selffont-bench \
            --output "build/${name}.zip"
          echo "NAME=${name}" >> "$GITHUB_ENV"
      - name: 解包为可直刷目录
        run: |
          set -euo pipefail
          rm -rf build/root
          unzip -oq "build/${NAME}.zip" -d build/root
          test -f build/root/module.prop
          test -f build/root/customize.sh
          ver=$(sed -n 's/^version=//p' build/root/module.prop)
          echo "VERSION=${ver}" >> "$GITHUB_ENV"
          echo "产物名 build-${ver}"
      - name: 验收（纯平移、字宽不变、墨心归位）
        run: |
          set -euo pipefail
          python - <<'PY' | tee build/verify.md
          import hashlib, io, os, statistics, zipfile
          from fontTools.ttLib import TTFont

          name, mother = os.environ["NAME"], os.environ["MOTHER_NAME"]
          raw = open(f"build/{name}.zip", "rb").read()
          with zipfile.ZipFile(f"build/{name}.zip") as z:
              packed = z.read(f"system/fonts/{mother}")
              prop = z.read("module.prop").decode()
              fonts = [n for n in z.namelist() if n.startswith("system/fonts/")]

          fixed_bytes = open("work/hpos/" + mother, "rb").read()
          assert packed == fixed_bytes, "包内字件不是修过定位的那一份"

          before = TTFont(os.path.join("work", mother))
          after = TTFont(io.BytesIO(packed))
          cmap = before.getBestCmap()
          gb, ga = before["glyf"], after["glyf"]
          hb, ha = before["hmtx"], after["hmtx"]

          def cjk(cp): return 0x4E00 <= cp <= 0x9FFF or 0x3400 <= cp <= 0x4DBF

          moved = bad_shift = bad_adv = 0
          for cp, gname in cmap.items():
              if not cjk(cp):
                  continue
              b, a = gb[gname], ga[gname]
              if b.numberOfContours <= 0:
                  continue
              dx = a.xMin - b.xMin
              if dx:
                  moved += 1
                  deltas = {(round(ax - bx), round(ay - by))
                            for (bx, by), (ax, ay) in zip(b.coordinates, a.coordinates)}
                  if deltas - {(dx, 0)}:
                      bad_shift += 1
              if hb[gname][0] != ha[gname][0]:
                  bad_adv += 1
          assert bad_shift == 0, f"{bad_shift} 个字的点位移不相等（不是纯平移）"
          assert bad_adv == 0, f"{bad_adv} 个字的 advance 变了"

          cjk_glyphs = [cmap[cp] for cp in cmap if cjk(cp)]
          advs = {ha[g][0] for g in cjk_glyphs}
          assert advs == {1000}, f"汉字 advance 不再全是 1000：{sorted(advs)[:5]}"
          lsb_bad = sum(1 for g in cjk_glyphs
                        if ga[g].numberOfContours > 0 and ha[g][1] != ga[g].xMin)
          assert lsb_bad == 0, f"lsb ≠ xMin 的字 {lsb_bad} 个"

          def centres(font):
              out = []
              for cp, gname in font.getBestCmap().items():
                  if not cjk(cp):
                      continue
                  g = font["glyf"][gname]
                  if g.numberOfContours > 0 and g.xMax - g.xMin >= 850:
                      out.append((g.xMin + g.xMax) / 2 - 500)
              return out

          cb, ca = centres(before), centres(after)
          assert len(cb) == len(ca), "满格字数量变了"

          def share(values, limit=20):
              return 100 * sum(1 for v in values if abs(v) <= limit) / len(values)

          assert share(ca) >= 99.5, f"修完满格字 |dcx|≤20 只有 {share(ca):.2f}%"
          assert share(ca) > share(cb), "修完反而更偏"

          fields = dict(l.split("=", 1) for l in prop.splitlines() if "=" in l)
          print("\n".join([
              "| 项 | 值 |", "| --- | --- |",
              f"| 包 | `{name}.zip` |",
              f"| 包 sha256 | `{hashlib.sha256(raw).hexdigest()}` |",
              f"| 包大小 | {len(raw):,} B |",
              f"| 版本 | `{fields.get('version')}`（versionCode {fields.get('versionCode')}） |",
              f"| 汉字字件 | `{mother}` {len(packed):,} B（母版字节 → 只平移过的字节） |",
              f"| 平移过的字 | {moved:,} 个，逐字位移处处相等（纯平移） |",
              f"| advance / lsb | 全 1000 / lsb==xMin 0 例外 |",
              f"| 满格字墨心 \\|dcx\\|≤20 | {share(cb):.2f}% → **{share(ca):.2f}%** |",
              f"| 满格字墨心 中位 \\|dcx\\| | {statistics.median(map(abs, cb)):.1f} → **{statistics.median(map(abs, ca)):.1f}** |",
              f"| 满格字墨心 最大 \\|dcx\\| | {max(map(abs, cb)):.1f} → **{max(map(abs, ca)):.1f}** |",
              f"| 包内 /system/fonts 字件 | {len(fonts)} 个 |",
          ]))
          PY
          cp build/verify.md "$GITHUB_STEP_SUMMARY"
      - name: 上传母版模块
        uses: actions/upload-artifact@v7
        with:
          name: Selffont-母版-${{ env.VERSION }}
          path: build/root
          retention-days: 5
          if-no-files-found: error
          overwrite: true

      - name: 生成校验文件（附件名用五段版本，跟 artifact 同名）
        run: |
          set -euo pipefail
          cd build
          # 出包那步的文件名是 build-<母版SHA8>-<run_number>.zip，artifact 是 build-<五段版本>。
          # 对外只留一个名字：build-<五段版本>.zip。
          cp "${NAME}.zip" "build-${VERSION}.zip"
          sha256sum "build-${VERSION}.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: 发布公开直链（Release 挂包与校验文件）
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 一个版本一个 tag，tag 必须钉在产出它的提交上：326 那次漏了 --target，tag 落到了 main 的 HEAD。
          gh release delete "${VERSION}" --repo "$REPO" --cleanup-tag --yes 2>/dev/null || true
          gh release create "${VERSION}" \
            "build/build-${VERSION}.zip" "build/SHA256SUMS.txt" \
            --repo "$REPO" \
            --target "$GITHUB_SHA" \
            --title "build-${VERSION}" \
            --notes-file build/verify.md
          {
            echo "### 直链（免登录）"
            echo
            echo "https://github.com/${REPO}/releases/download/${VERSION}/build-${VERSION}.zip"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  cleanup-artifacts:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
      - name: 清理超限产物与运行记录
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CLEANUP_SCOPE: actions
        run: python3 .github/scripts/cleanup.py

  cleanup-releases:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 清理多余 Release 与孤立 tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CLEANUP_SCOPE: releases
        run: python3 .github/scripts/cleanup.py
