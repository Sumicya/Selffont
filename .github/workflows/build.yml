# 出包工作流：push（不限分支）与手动触发，出 Selffont-<版本> 模块包并清理超限产物与运行记录。
name: Build

on:
  push:
  workflow_dispatch:

env:
  SEGMENTS: '5'
  CLEANUP_APPLY: 'true'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: 安装字体工具
        run: python -m pip install -r requirements.txt
      - name: 内建自检
        run: python build.py --check
      - name: 取号并出包
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: python build.py --query-ci
      - name: 确认产物名
        run: |
          zip_file=$(basename "$(find build -maxdepth 1 -name 'Selffont-*.zip' -print -quit)")
          test -n "$zip_file"
          name="${zip_file%.zip}"
          echo "$name" | grep -Eq '^Selffont-[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}\.[0-9]+\.[0-9]+$' || {
            echo "产物名不是五段规范版本：$name" >&2
            exit 1
          }
          echo "ARTIFACT_NAME=$name" >> "$GITHUB_ENV"
      - name: 解包为可直刷目录
        run: |
          rm -rf build/root
          unzip -q "build/${ARTIFACT_NAME}.zip" -d build/root
          test -f build/root/module.prop
          test -f build/root/customize.sh
      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: build/root
          retention-days: 5
          if-no-files-found: error
          overwrite: true

  cleanup-artifacts:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    concurrency:
      group: selffont-cleanup
      cancel-in-progress: false
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
      - name: 清理超限产物与运行记录
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CLEANUP_SCOPE: actions
        run: python3 .github/scripts/cleanup.py

  cleanup-releases:
    needs: build
    if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: selffont-cleanup
      cancel-in-progress: false
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 清理多余 Release 与孤立 tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CLEANUP_SCOPE: releases
        run: python3 .github/scripts/cleanup.py
