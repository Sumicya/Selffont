name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read          # 只为读本工作流的运行历史算版本号,不写
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Selfcheck / build / upload artifact
    runs-on: ubuntu-24.04   # 钉住版本,不用 ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install fonttools
        run: python -m pip install -r requirements.txt
      - name: Selfcheck (packager, metric normalization, module scripts)
        run: python build.py --check
      # 版本号在这一处算定:build.py --query-github 锚定本次运行(GITHUB_RUN_ID / GITHUB_RUN_NUMBER),
      # 不拿查询时的最新运行冒充本次;重试用同一身份,版本自然复用。取不到数就停,不出包不上传。
      - name: Build (version stamped)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python build.py --query-github
      # 出包前核对命名一致性:产物名与 artifact 名统一 Selffont-<五段版本>,不合规范就不上传。
      - name: Stage artifact name (Selffont-<五段版本>)
        run: |
          zip_file=$(basename "$(find build -maxdepth 1 -name 'Selffont*.zip' -print -quit)")
          test -n "$zip_file"
          ls -l "build/$zip_file"
          name="${zip_file%.zip}"
          echo "$name" | grep -Eq '^Selffont-[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}\.[0-9]+\.[0-9]+$' || {
            echo "产物名不符合规范的五段版本格式:$name" >&2
            exit 1
          }
          echo "ARTIFACT_NAME=$name" >> "$GITHUB_ENV"
      # 包直出:artifact 本身就是可刷的模块包,不再 zip 套 zip——网页下载下来直接给管理器刷,
      # 不用先解一层。upload-artifact 会把搜索路径的最近公共祖先当作包内根目录(官方 README),
      # 所以上传目录内容 = 包内根就是 module.prop。代价:gh run download 会把内容摊进目标目录,
      # 用 -D 指定一个空目录。
      - name: Unpack for direct-flash artifact
        run: |
          rm -rf build/root
          unzip -q "build/${ARTIFACT_NAME}.zip" -d build/root
          test -f build/root/module.prop
          test -f build/root/customize.sh
          find build/root -maxdepth 1 | sort
      # CI 出包(不是发版):push 与 PR 都照传,名 = <项目名>-<五段版本>,留 5 天兜底;
      # 上传用 runner 自带令牌,不需要写权限。Release / tag / 正式 asset 一概不碰。
      - name: Upload module (Actions artifact)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: build/root
          retention-days: 5
          if-no-files-found: error
  cleanup:
    name: Keep newest 5 artifacts
    needs: build
    # 写权限只给可信的默认分支构建 job(第二十四版「清理通用步骤」步骤 1)。PR 与非默认分支都不跑——
    # 它们出的包照样计入同一保留窗口,由下一次 main 构建清理;分支期间超额由人工按 README 的
    # gh api -X DELETE 收口,不为此把写权限交给分支代码。
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write        # 只删 Actions artifact;contents 保持只读,不碰 Release / tag
    concurrency:
      group: selffont-artifacts
      cancel-in-progress: false
    steps:
      - name: Delete old Selffont artifacts (full pagination, keep newest 5)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP: "5"
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys

          keep_raw = os.environ["KEEP"].strip()
          if not keep_raw.isdigit() or int(keep_raw) < 1:
              sys.exit(f"KEEP 必须是正整数,收到 {keep_raw!r}")
          keep = int(keep_raw)
          repo = os.environ["REPO"]

          def api(path, jq=None, method=None):
              command = ["gh", "api"] + (["--jq", jq] if jq else []) + (["-X", method] if method else []) + [path]
              result = subprocess.run(command, capture_output=True, text=True)
              if result.returncode != 0:
                  sys.exit(f"gh api {path} 失败:{result.stderr.strip()}")
              return result.stdout

          repo_id = int(json.loads(api(f"repos/{repo}", jq="{id: .id}"))["id"])

          def artifacts():
              """完整分页取 artifact;名字前缀只用于筛候选,归属另按运行记录核验。"""
              rows, page = [], 1
              while True:
                  batch = [json.loads(line) for line in
                           api(f"repos/{repo}/actions/artifacts?per_page=100&page={page}",
                               jq=".artifacts[]|{id,name,created_at,size_in_bytes,workflow_run}").splitlines()
                           if line.strip()]
                  if not batch:
                      return rows
                  rows += batch
                  page += 1

          rows = [row for row in artifacts() if row["name"].lower().startswith("selffont-")]

          # 归属核验(规范:前缀只筛候选,归属结合工作流与运行记录;归属不明的不删):
          # artifact 的 workflow_run 必须落在本仓库,否则视为别人的对象,跳过并打印。
          def owned(row):
              run = row.get("workflow_run") or {}
              return run.get("repository_id") == repo_id and run.get("head_repository_id") == repo_id

          unknown = [row for row in rows if not owned(row)]
          rows = [row for row in rows if owned(row)]
          rows.sort(key=lambda row: row["created_at"], reverse=True)
          print(f"匹配到 {len(rows)} 个本项目 artifact(另有 {len(unknown)} 个归属不明,保留),保留最近 {keep} 个;完整清单:")
          for row in rows:
              print(f"  {row['created_at']} {row['name']} {row['size_in_bytes']} 字节 id={row['id']}")
          for row in unknown:
              print(f"  归属不明(保留) {row['created_at']} {row['name']} id={row['id']} workflow_run={row.get('workflow_run')}")
          victims = rows[keep:]
          for row in victims:
              print(f"DELETE {row['created_at']} {row['name']} {row['size_in_bytes']} 字节 id={row['id']}")
              api(f"repos/{repo}/actions/artifacts/{row['id']}", method="DELETE")

          # 删完复核:本项目 artifact 不得超过保留数;超了就报错(不回滚新产物、不动保留对象)。
          left = [row for row in artifacts() if row["name"].lower().startswith("selffont-") and owned(row)]
          print(f"已删 {len(victims)} 个,复核后本项目 artifact {len(left)} 个(上限 {keep})")
          if len(left) > keep:
              sys.exit(f"清理后仍有 {len(left)} 个本项目 artifact,超过上限 {keep}")
          releases = json.loads(api(f"repos/{repo}/releases", jq="length"))
          print(f"Release 数:{releases}(规范上限 1。CI 不发版也不删 Release;"
                "获准人工发布时由发布者做发布后清理)")
          if releases > 1:
              print("WARNING: Release 超过 1 个,需要获准的人工操作清理(CI 无 contents 写权限)")
          PY
