name: Build Selffont
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      font:
        description: 主字体:URL 或仓库内相对路径(留空用内置默认源)
        required: false
      base:
        description: 基础包 ZIP:URL 或仓库内相对路径(留空用内置默认源)
        required: false
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  module:
    name: Font module (KSU zip)
    runs-on: ubuntu-24.04   # 钉住版本,不用 ubuntu-latest(它的迁移提示会一直挂着)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install fonttools
        run: python -m pip install -r tools/requirements.txt
      - name: Selfcheck (packager, metric normalization, runtime scripts)
        run: python tests/selfcheck.py
      - name: Build module (stamp version = vYY.M.D.<run number>)
        env:
          SELFFONT_BUILD: ${{ github.run_number }}   # 总构建数:versionCode 就是它
          SELFFONT_FONT: ${{ inputs.font }}          # 经 env 传入,不进 shell 插值
          SELFFONT_BASE: ${{ inputs.base }}
        run: |
          args=(--revision "$GITHUB_SHA")
          # 空值不追加;用 if 而不是 `[ -n ] && ...`——后者在空输入时会让 `bash -e` 直接退出
          if [ -n "$SELFFONT_FONT" ]; then args+=(--font "$SELFFONT_FONT"); fi
          if [ -n "$SELFFONT_BASE" ]; then args+=(--base "$SELFFONT_BASE"); fi
          python tools/build.py "${args[@]}"
          (cd build && sha256sum Selffont.zip > Selffont.zip.sha256)
      - name: Report
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, zipfile
          with zipfile.ZipFile('build/Selffont.zip') as archive:
              report = json.loads(archive.read('report.json'))
              prop = dict(line.split('=', 1) for line in archive.read('module.prop').decode().splitlines())
          print(f"**{prop['version']}** · versionCode `{prop['versionCode']}` · `{report['revision'][:12]}`")
          print(f"主字体 `{report['primary']['family']}` · 补充 {len(report['bundledSupplementalFonts'])} 个 · "
                f"引用未打包 {len(report['unbundledFontReferences'])} 个(设备自带)")
          top = [f"`{row['file']} {row['highest']}`" for row in report['emojiCoverage'][:3]]
          print(f"emoji 覆盖上限:{', '.join(top) or '(包内无 emoji 段)'}")
          for warning in report['warnings']:
              print(f"::warning::{warning}")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: selffont-module
          path: |
            build/Selffont.zip
            build/Selffont.zip.sha256
          compression-level: 0
          if-no-files-found: error
