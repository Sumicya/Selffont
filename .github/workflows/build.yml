# 母版工作流：只出 build-<五段版本>（Maruko 原字节进 Magisk 模块，只做水平/竖向定位归位，不改轮廓）。
# 只上传 Actions artifact（5 天）：不发 Release、不打 tag、不建直链——发版是手工动作，流水线里没有这条路径。
name: build

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'lsp/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

env:
  SEGMENTS: '5'
  CLEANUP_APPLY: 'true'
  MOTHER_SHA256: 'e3709389bce13fa75af28cc2370b6175520d97f74dfbf3894ca24838f47241b7'
  MOTHER_NAME: 'MarukoGothicCJKsc-Regular.ttf'
  MOTHER_REF: '97e9dd4'

concurrency:
  group: selffont-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      statuses: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: 恢复 pip 缓存
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-
      - name: 恢复字体缓存
        uses: actions/cache@v5
        with:
          path: build/cache
          key: fonts-v1-${{ runner.os }}
          restore-keys: fonts-v1-
      - name: 安装字体工具
        run: python -m pip install -r requirements.txt
      - name: 内建自检
        run: python build.py --check
      - name: 取自母版原始字节
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build work
          gh api "repos/max32002/maruko-gothic/contents/CJK%20SC/${MOTHER_NAME}?ref=${MOTHER_REF}" \
            -H "Accept: application/vnd.github.raw" > "work/${MOTHER_NAME}"
          sum=$(sha256sum "work/${MOTHER_NAME}" | cut -d' ' -f1)
          echo "尺寸 $(stat -c%s "work/${MOTHER_NAME}") B  sha256 $sum"
          [ "$sum" = "$MOTHER_SHA256" ] || {
            echo "母版字节与钉子不符：母版可能已换包，先核对再出包。" >&2
            exit 1
          }
      - name: 修水平与竖向定位（只平移，不缩放、不改轮廓）
        run: |
          set -euo pipefail
          # 母版 27,559 个汉字全是 1000 宽的字格，但墨迹不都落在格子中间。
          # 横向：满格字里 10.3% 的墨心偏离 500 超过 20 单位（=2% em），最远 ±54.5，整体偏左。
          # 竖向：满宽满高字里 |墨心−设计中线 377.5|>20 的有 1,594 个，最远 47（幵 珥 羽 平 雨 研），
          # 屏幕上就是「有的字浮高、有的下沉」。两步都只做一件事：整字平移，轮廓相对彼此一个点不动。
          # 输出保持原文件名：包内字件名与 fonts.xml 的引用都靠它。
          mkdir -p build work/hpos work/vpos
          python tools/fix_hpos.py "work/${MOTHER_NAME}" -o "work/hpos/${MOTHER_NAME}" \
            | tee build/hpos.md
          python tools/fix_vpos.py "work/hpos/${MOTHER_NAME}" -o "work/vpos/${MOTHER_NAME}" \
            | tee -a build/hpos.md
          cp build/hpos.md "$GITHUB_STEP_SUMMARY"
      - name: 取版本号（五段，不带 SHA）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 号源只有一处实现（tools/ci_version.py），当日号按当日运行数算。
          # 上一版这里写死 `--day 1`，于是同一天出多少个包当日号都是假的 1
          # （主人 2026-11-09 实查 build-26.11.9.1.367 / .368 发现），违 §14。
          VERSION=$(python3 tools/ci_version.py --workflow build.yml)
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "产物名 build-${VERSION}"
      - name: 出包（母版 + 水平/竖向定位修正）
        run: |
          set -euo pipefail
          # 五段 yy.m.d.当日号.总序号，全部来自上一步取号，不再自己拼日期。
          name="build-${VERSION}"
          python build.py --passthrough-mother "work/vpos/${MOTHER_NAME}" \
            --date "$(echo "$VERSION" | cut -d. -f1-3)" \
            --day "$(echo "$VERSION" | cut -d. -f4)" \
            --build "$(echo "$VERSION" | cut -d. -f5)" --module-id selffont-bench \
            --output "build/${name}.zip"
          echo "NAME=${name}" >> "$GITHUB_ENV"
      - name: 解包为可直刷目录
        run: |
          set -euo pipefail
          rm -rf build/root
          unzip -oq "build/${NAME}.zip" -d build/root
          test -f build/root/module.prop
          test -f build/root/customize.sh
          ver=$(sed -n 's/^version=//p' build/root/module.prop)
          # 取号器算出的版本与包内 module.prop 的 version 必须同一串：
          # 上一版这里直接覆盖 VERSION，产物名就跟着包内版本走，号源等于被绕过。
          test "$ver" = "$VERSION" || { echo "::error::包内 version=${ver} 与取号 ${VERSION} 不一致"; exit 1; }
          echo "产物名 build-${VERSION}"
      - name: 验收（纯平移、字宽不变、横竖墨心归位）
        run: |
          set -euo pipefail
          python - <<'PY' | tee build/verify.md
          import hashlib, io, os, statistics, zipfile
          from fontTools.ttLib import TTFont

          name, mother = os.environ["NAME"], os.environ["MOTHER_NAME"]
          raw = open(f"build/{name}.zip", "rb").read()
          with zipfile.ZipFile(f"build/{name}.zip") as z:
              packed = z.read(f"system/fonts/{mother}")
              prop = z.read("module.prop").decode()
              fonts = [n for n in z.namelist() if n.startswith("system/fonts/")]
              shell = (z.read("system/fonts/Roboto-Regular.ttf")
                       if "system/fonts/Roboto-Regular.ttf" in fonts else None)

          fixed_bytes = open("work/vpos/" + mother, "rb").read()
          # ★ 2026-11-10：出包时直通件会过 normalize_metrics 把行框对齐设备空壳
          #   （930/-250/0），所以这里**不能**再要求整份字节相等 —— 那条断言等于
          #   禁止行框归一，而直通件正是全包唯一没过归一的那一份。
          #   改成：轮廓与 hmtx 必须与 work/vpos 那一份逐字相等（下面几段已经在查），
          #   外加一条「hhea 已被对齐到空壳」的正面断言。
          # 行框目标值取自**同一个包里的度量空壳**（不猜磁盘路径）；空壳不在包里
          # 就直接挂 —— 不许「找不到就跳过」，那正是假绿。
          assert shell is not None, "包里没有度量空壳 system/fonts/Roboto-Regular.ttf，无法验证行框对齐"
          _want = TTFont(io.BytesIO(shell))["hhea"].ascent
          _got = TTFont(io.BytesIO(packed))["hhea"].ascent
          assert _got == _want, f"直通件行框没对齐空壳：hhea.ascent={_got}，应为 {_want}"

          before = TTFont(os.path.join("work", mother))
          after = TTFont(io.BytesIO(packed))
          cmap = before.getBestCmap()
          gb, ga = before["glyf"], after["glyf"]
          hb, ha = before["hmtx"], after["hmtx"]

          def cjk(cp): return 0x4E00 <= cp <= 0x9FFF or 0x3400 <= cp <= 0x4DBF

          moved = bad_shift = bad_adv = 0
          for cp, gname in cmap.items():
              if not cjk(cp):
                  continue
              b, a = gb[gname], ga[gname]
              if b.numberOfContours <= 0:
                  continue
              dx = round(a.xMin - b.xMin)
              dy = round(a.yMin - b.yMin)
              if dx or dy:
                  moved += 1
                  deltas = {(round(ax - bx), round(ay - by))
                            for (bx, by), (ax, ay) in zip(b.coordinates, a.coordinates)}
                  if deltas - {(dx, dy)}:
                      bad_shift += 1
              if hb[gname][0] != ha[gname][0]:
                  bad_adv += 1
          assert bad_shift == 0, f"{bad_shift} 个字的点位移不相等（不是纯平移）"
          assert bad_adv == 0, f"{bad_adv} 个字的 advance 变了"

          cjk_glyphs = [cmap[cp] for cp in cmap if cjk(cp)]
          advs = {ha[g][0] for g in cjk_glyphs}
          assert advs == {1000}, f"汉字 advance 不再全是 1000：{sorted(advs)[:5]}"
          lsb_bad = sum(1 for g in cjk_glyphs
                        if ga[g].numberOfContours > 0 and ha[g][1] != ga[g].xMin)
          assert lsb_bad == 0, f"lsb ≠ xMin 的字 {lsb_bad} 个"

          def centres(font):
              out = []
              for cp, gname in font.getBestCmap().items():
                  if not cjk(cp):
                      continue
                  g = font["glyf"][gname]
                  if g.numberOfContours > 0 and g.xMax - g.xMin >= 850:
                      out.append((g.xMin + g.xMax) / 2 - 500)
              return out

          cb, ca = centres(before), centres(after)
          assert len(cb) == len(ca), "满格字数量变了"

          def share(values, limit=20):
              return 100 * sum(1 for v in values if abs(v) <= limit) / len(values)

          assert share(ca) >= 99.5, f"修完满格字 |dcx|≤20 只有 {share(ca):.2f}%"
          assert share(ca) > share(cb), "修完反而更偏"

          def vcentres(font):
              out = []
              for cp, gname in font.getBestCmap().items():
                  if not cjk(cp):
                      continue
                  g = font["glyf"][gname]
                  if g.numberOfContours > 0 and g.xMax - g.xMin >= 850 and g.yMax - g.yMin >= 850:
                      out.append((g.yMin + g.yMax) / 2)
              return out

          vb, va = vcentres(before), vcentres(after)
          assert len(vb) == len(va), "满宽满高字数量变了"
          mid = statistics.median(vb)
          dvb = [abs(v - mid) for v in vb]
          dva = [abs(v - mid) for v in va]
          vshare = lambda v: 100 * sum(1 for x in v if x <= 20) / len(v)
          assert vshare(dva) >= 99.0, f"修完满宽满高字 |dcy|≤20 只有 {vshare(dva):.2f}%"
          assert vshare(dva) > vshare(dvb), "竖向修完反而更偏"

          fields = dict(l.split("=", 1) for l in prop.splitlines() if "=" in l)
          print("\n".join([
              "| 项 | 值 |", "| --- | --- |",
              f"| 包 | `{name}.zip` |",
              f"| 包 sha256 | `{hashlib.sha256(raw).hexdigest()}` |",
              f"| 包大小 | {len(raw):,} B |",
              f"| 版本 | `{fields.get('version')}`（versionCode {fields.get('versionCode')}） |",
              f"| 汉字字件 | `{mother}` {len(packed):,} B（母版字节 → 只平移过的字节） |",
              f"| 平移过的字 | {moved:,} 个，逐字 (dx,dy) 处处相等（纯平移） |",
              f"| advance / lsb | 全 1000 / lsb==xMin 0 例外 |",
              f"| 满格字墨心 \\|dcx\\|≤20 | {share(cb):.2f}% → **{share(ca):.2f}%** |",
              f"| 满格字墨心 中位 \\|dcx\\| | {statistics.median(map(abs, cb)):.1f} → **{statistics.median(map(abs, ca)):.1f}** |",
              f"| 满格字墨心 最大 \\|dcx\\| | {max(map(abs, cb)):.1f} → **{max(map(abs, ca)):.1f}** |",
              f"| 满宽满高字 \\|dcy\\|≤20 | {vshare(dvb):.2f}% → **{vshare(dva):.2f}%** |",
              f"| 满宽满高字 中位 \\|dcy\\| | {statistics.median(dvb):.1f} → **{statistics.median(dva):.1f}** |",
              f"| 满宽满高字 最大 \\|dcy\\| | {max(dvb):.1f} → **{max(dva):.1f}** |",
              f"| 包内 /system/fonts 字件 | {len(fonts)} 个 |",
          ]))
          PY
          cp build/verify.md "$GITHUB_STEP_SUMMARY"
      - name: 上传母版模块
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ env.VERSION }}
          path: build/root
          retention-days: 5
          if-no-files-found: error
          overwrite: true

  cleanup-artifacts:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
      - name: 清理超限产物与运行记录
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CLEANUP_SCOPE: actions
        run: python3 .github/scripts/cleanup.py
