name: Build
# 出包工作流，唯一号源：只接 push（限默认分支 main）与 workflow_dispatch。
# pull_request 固定走独立的 pr-check.yml——不是靠这边的步骤级 if 挡,是两个工作流文件各有
# 独立的 run_number 序列,PR 事件物理上碰不到这个文件的号段(真实根因见 pr-check.yml 顶部注释)。
# 调试 CI 的推送不该吃号,push 触发器只认默认分支。这个工作流对会话分支天然不可达(push 限默认
# 分支、workflow_dispatch 需要会话没有的 actions: write);2026-10-14 之前真删只挂在这一个
# 文件上,导致会话侧永远等不到真删——现在 pr-check.yml 的 cleanup job 也真删(同仓 pull_request
# 事件里 GITHUB_TOKEN 能拿到声明的写权限,会话推送到同仓开的 PR 即可触发,与这里共用同一份
# .github/scripts/cleanup.py、同一个 concurrency group 串行),这个工作流不再是唯一的真删入口。
on:
  push:
    branches: [ main ]
  workflow_dispatch:
env:
  SEGMENTS: "5"   # 当前版本号段数(正常五段);真要退化成四段的时期,把这改成 4 并在 AGENTS.md 写明原因
permissions:
  contents: read
  actions: read          # 只为读本工作流的运行历史算版本号,不写
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Selfcheck / build / upload artifact
    runs-on: ubuntu-24.04   # 钉住版本,不用 ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install fonttools
        run: python -m pip install -r requirements.txt
      - name: Selfcheck (packager, metric normalization, module scripts)
        run: python build.py --check
      # 版本号在这一处算定:build.py --query-github 锚定本次运行(GITHUB_RUN_ID / GITHUB_RUN_NUMBER),
      # 不拿查询时的最新运行冒充本次;重试用同一身份,版本自然复用。取不到数就停,不出包不上传。
      # 本工作流不接 pull_request 事件(见上方 on:),到这一步时一定是 push(仅 main)或
      # workflow_dispatch,不需要再用步骤级 if 挡——PR 校验在独立的 pr-check.yml 里跑。
      - name: Build (version stamped)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python build.py --query-github
      # 出包前核对命名一致性:产物名与 artifact 名统一 Selffont-<版本>,不合规范就不上传。
      # 版本允许五段(yy.m.d.当日序号.总序号)或当日序号取不到时退化的四段(yy.m.d.总序号)——
      # 跟 build.py 的 VERSION_RE / VERSION_RE4 保持同一套正则,别只认五段把合法的退化包拦下来。
      - name: Stage artifact name (Selffont-<版本>)
        run: |
          zip_file=$(basename "$(find build -maxdepth 1 -name 'Selffont*.zip' -print -quit)")
          test -n "$zip_file"
          ls -l "build/$zip_file"
          name="${zip_file%.zip}"
          echo "$name" | grep -Eq '^Selffont-[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}\.[0-9]+(\.[0-9]+)?$' || {
            echo "产物名不符合规范的版本格式(五段或退化四段):$name" >&2
            exit 1
          }
          echo "ARTIFACT_NAME=$name" >> "$GITHUB_ENV"
      # 包直出:artifact 本身就是可刷的模块包,不再 zip 套 zip——网页下载下来直接给管理器刷,
      # 不用先解一层。upload-artifact 会把搜索路径的最近公共祖先当作包内根目录(官方 README),
      # 所以上传目录内容 = 包内根就是 module.prop。代价:gh run download 会把内容摊进目标目录,
      # 用 -D 指定一个空目录。
      - name: Unpack for direct-flash artifact
        run: |
          rm -rf build/root
          unzip -q "build/${ARTIFACT_NAME}.zip" -d build/root
          test -f build/root/module.prop
          test -f build/root/customize.sh
          find build/root -maxdepth 1 | sort
      # CI 出包(不是发版):只有 push(仅 main)与 workflow_dispatch 传,名 = <项目名>-<版本>,
      # 留 5 天兜底;PR 校验在独立的 pr-check.yml 里跑,这个工作流根本收不到 pull_request 事件。
      # 上传用 runner 自带令牌,不需要写权限。Release / tag / 正式 asset 一概不碰。
      - name: Upload module (Actions artifact)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: build/root
          retention-days: 5
          if-no-files-found: error
  cleanup:
    name: Clean up (quantity / naming / source / duplicate day-index)
    needs: build
    # 写权限只给可信的默认分支构建 job(规范:清理 job 权限最小化,只删本项目对象)。本工作流
    # 不接 pull_request,这里只按 ref 再做一道保险:非默认分支(如会话分支用 workflow_dispatch
    # 触发出包)不给这个 job 写权限、不跑清理。这不是唯一的真删入口——pr-check.yml 的 cleanup
    # job 同样真删,会话推送到同仓 PR 即可触发,不用等这里的下一次 main 构建;两处共用同一份
    # .github/scripts/cleanup.py、同一个 concurrency group(selffont-artifacts)串行,不经
    # 会话令牌、不经人工去手动点。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write        # 只删 Actions artifact 与 run;contents 保持只读,不碰 Release / tag
    concurrency:
      group: selffont-artifacts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      # 真删:脚本与 pr-check.yml 的 cleanup-preview 共用同一份 .github/scripts/cleanup.py,
      # 靠 CLEANUP_APPLY 区分——这里是 true,判定即执行删除;脚本内部判据顺序与说明见该文件。
      - name: Delete by criteria (口径 / 来源 / 重复当日序号 / 数量)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP: "5"
          SEGMENTS: ${{ env.SEGMENTS }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CLEANUP_APPLY: "true"
        run: python3 .github/scripts/cleanup.py
