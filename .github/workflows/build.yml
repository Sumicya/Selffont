# 出包工作流：push 跑预览子集（96 秒），[full] 提交或手动触发跑全量。不发 Release、不打 tag。
name: build

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'bad/**'
      - 'lsp/**'          # B 线（探针）只在 probe.yml 里编，字体 job 不跟着跑
      - '.github/workflows/probe.yml'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      full:
        description: '跑全量构建（默认 true；push 时一律只出预览子集）'
        type: boolean
        default: true
      selffont:
        description: '出 selffont 模块（自研字体还不合格，默认关；关时只发 selfrounds 字体）'
        type: boolean
        default: false

env:
  SEGMENTS: '5'
  CLEANUP_APPLY: 'true'

concurrency:
  group: selffont-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      statuses: write   # 失败时把 build.log 最后一行写进 commit status（日志宿主取不到）
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: 恢复 pip 缓存
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-
      - name: 恢复字体缓存
        uses: actions/cache@v5
        with:
          path: build/cache
          key: fonts-v1-${{ runner.os }}
          restore-keys: fonts-v1-
      - name: 安装字体工具
        run: python -m pip install -r requirements.txt
      - name: 内建自检
        run: python build.py --check
      - name: 判断构建模式
        id: mode
        run: |
          # selffont 模块（自研字体）默认不出：主人 2026-11-05「字体太过垃圾所以不搞」。
          # 只有手动触发且勾了 selffont 才走全量出模块这条；push 永远只发 selfrounds 字体。
          if { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full }}" = "true" ] \
               && [ "${{ inputs.selffont }}" = "true" ]; } \
             || printf '%s' "${{ github.event.head_commit.message }}" | grep -q '\[selffont\]'; then
            echo "full=1" >> "$GITHUB_OUTPUT"
            echo "全量构建（selffont 模块）"
          else
            echo "full=0" >> "$GITHUB_OUTPUT"
            echo "只发 selfrounds 字体（预览子集，不出模块）"
          fi
      - name: 预览出包
        if: steps.mode.outputs.full != '1'
        run: |
          echo "SHA8=${GITHUB_SHA::8}" >> "$GITHUB_ENV"
          python build.py --preview '鬱響鬢Ay?' --preview-out build/preview
      - name: 取号并出包
        if: steps.mode.outputs.full == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          python build.py --query-ci 2>&1 | tee build.log
      - name: 失败时把日志尾巴报成注解
        if: failure()
        # 摘要页那块在 GitHub 页面上是「### Uh oh! There was an error while loading」，读不到；
        # 注解（::error::）在运行页的 Annotations 里直接显示，能抓下来。多行拼成一条注解会被
        # 页面截成一句，所以逐行发（最多 10 条）；异常那一行另发一条 commit status，
        # description 有 140 字，正好装得下。
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ ! -f build.log ]; then
            echo "::error title=build.log::没有 build.log"
            exit 0
          fi
          tail -n 6 build.log | while IFS= read -r line; do
            echo "::error title=build.log::${line}"
          done
          desc=$(tail -n 1 build.log | cut -c1-120)
          gh api -X POST "repos/${REPO}/statuses/${GITHUB_SHA}" \
            -f state=failure -f context=build-log -f description="$desc" >/dev/null || true
      - name: 失败时把日志写进运行摘要
        if: failure()
        # 运行日志本体走 results-receiver / blob.core.windows.net，本机取不到（握手 EOF），
        # 产物里的 build-log 也一样要过同一个域名。摘要走的是页面 HTML，能直接读，
        # 所以失败时把日志尾巴抄一份到摘要里——不然只知道「exit 1」，不知道为什么。
        run: |
          {
            echo '### build.log 末尾 120 行'
            echo '```'
            if [ -f build.log ]; then tail -n 120 build.log; else echo '（没有 build.log）'; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 失败时上传构建日志
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ github.run_id }}
          path: build.log
          retention-days: 2
          if-no-files-found: error
          overwrite: true
      - name: 确认产物名
        if: steps.mode.outputs.full == '1'
        run: |
          zip_file=$(basename "$(find build -maxdepth 1 -name 'Selffont-*.zip' -print -quit)")
          test -n "$zip_file"
          name="${zip_file%.zip}"
          echo "$name" | grep -Eq '^Selffont-[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}\.[0-9]+\.[0-9]+$' || {
            echo "产物名不是五段规范版本：$name" >&2
            exit 1
          }
          echo "ARTIFACT_NAME=$name" >> "$GITHUB_ENV"
          echo "VERSION=${name#Selffont-}" >> "$GITHUB_ENV"
      - name: 解包为可直刷目录
        if: steps.mode.outputs.full == '1'
        run: |
          rm -rf build/root
          unzip -oq "build/${ARTIFACT_NAME}.zip" -d build/root
          test -f build/root/module.prop
          test -f build/root/customize.sh
      - name: 记录产物哈希
        if: steps.mode.outputs.full == '1'
        id: sha
        run: |
          sum=$(sha256sum "build/${ARTIFACT_NAME}.zip" | cut -d' ' -f1)
          echo "$sum  ${ARTIFACT_NAME}.zip" > build/SHA256SUMS.txt
          cp build/SHA256SUMS.txt build/root/SHA256SUMS.txt
          echo "sum=$sum" >> "$GITHUB_OUTPUT"
          echo "sum8=${sum:0:8}" >> "$GITHUB_OUTPUT"
          echo "sha256=$sum  ${ARTIFACT_NAME}.zip"
      - name: 上传正式产物
        if: steps.mode.outputs.full == '1'
        uses: actions/upload-artifact@v7
        with:
          # 三类产物各用一个固定前缀，别混（主人 2026-11-05 第四次强调）：
          #   build      → 母版 Magisk 模块（mother.yml）
          #   selffont   → 自研字体 Magisk 模块（本行；默认关，字体不合格）
          #   selfrounds → Selfrounds 字体本身（下面那一处）
          name: selffont-${{ env.VERSION }}
          path: build/root
          retention-days: 5
          if-no-files-found: error
          overwrite: true
      - name: 上传哈希
        if: steps.mode.outputs.full == '1'
        uses: actions/upload-artifact@v7
        with:
          name: Selffont-sha256-${{ steps.sha.outputs.sum8 }}
          path: build/SHA256SUMS.txt
          retention-days: 5
          if-no-files-found: error
          overwrite: true
      - name: 上传预览产物
        if: steps.mode.outputs.full != '1'
        uses: actions/upload-artifact@v7
        with:
          name: selfrounds-${{ env.SHA8 }}
          path: build/preview
          retention-days: 3
          if-no-files-found: error
          overwrite: true

  cleanup-artifacts:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
      - name: 清理超限产物与运行记录
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CLEANUP_SCOPE: actions
        run: python3 .github/scripts/cleanup.py

  cleanup-releases:
    needs: build
    if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 清理多余 Release 与孤立 tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CLEANUP_SCOPE: releases
        run: python3 .github/scripts/cleanup.py
