# 母版工作流：只出 build-<五段版本>（Maruko 原字节进 Magisk 模块，只做水平/竖向定位归位，不改轮廓）。
# 只上传 Actions artifact（5 天）：不发 Release、不打 tag、不建直链——发版是手工动作，流水线里没有这条路径。
name: build

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'lsp/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

env:
  SEGMENTS: '5'
  CLEANUP_APPLY: 'true'
  MOTHER_SHA256: 'e3709389bce13fa75af28cc2370b6175520d97f74dfbf3894ca24838f47241b7'
  MOTHER_NAME: 'MarukoGothicCJKsc-Regular.ttf'
  MOTHER_REF: '97e9dd4'

concurrency:
  group: selffont-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      statuses: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: 恢复 pip 缓存
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-
      - name: 恢复字体缓存
        uses: actions/cache@v5
        with:
          path: build/cache
          key: fonts-v1-${{ runner.os }}
          restore-keys: fonts-v1-
      - name: 安装字体工具
        run: python -m pip install -r requirements.txt
      - name: 内建自检
        run: python build.py --check
      - name: 取自母版原始字节
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build work
          gh api "repos/max32002/maruko-gothic/contents/CJK%20SC/${MOTHER_NAME}?ref=${MOTHER_REF}" \
            -H "Accept: application/vnd.github.raw" > "work/${MOTHER_NAME}"
          sum=$(sha256sum "work/${MOTHER_NAME}" | cut -d' ' -f1)
          echo "尺寸 $(stat -c%s "work/${MOTHER_NAME}") B  sha256 $sum"
          [ "$sum" = "$MOTHER_SHA256" ] || {
            echo "母版字节与钉子不符：母版可能已换包，先核对再出包。" >&2
            exit 1
          }
      - name: 修水平与竖向定位（只平移，不缩放、不改轮廓）
        run: |
          set -euo pipefail
          # 母版 27,559 个汉字全是 1000 宽的字格，但墨迹不都落在格子中间。
          # 横向：满格字里 10.3% 的墨心偏离 500 超过 20 单位（=2% em），最远 ±54.5，整体偏左。
          # 竖向：满宽满高字里 |墨心−设计中线 377.5|>20 的有 1,594 个，最远 47（幵 珥 羽 平 雨 研），
          # 屏幕上就是「有的字浮高、有的下沉」。两步都只做一件事：整字平移，轮廓相对彼此一个点不动。
          # 输出保持原文件名：包内字件名与 fonts.xml 的引用都靠它。
          mkdir -p build work/hpos work/vpos
          python tools/fix_hpos.py "work/${MOTHER_NAME}" -o "work/hpos/${MOTHER_NAME}" \
            | tee build/hpos.md
          python tools/fix_vpos.py "work/hpos/${MOTHER_NAME}" -o "work/vpos/${MOTHER_NAME}" \
            | tee -a build/hpos.md
          cp build/hpos.md "$GITHUB_STEP_SUMMARY"
      - name: 拉丁侧距与字偶距（只动拉丁，汉字一个点不动）
        run: |
          set -euo pipefail
          # 母版的拉丁侧距过宽、kern 也坏（39,171 条里有一批是压穿的，`Fu` 的墨距
          # 实测 112 而包围盒报 501）。这两步只处理 0x41-0x7A 的字母：
          #   slim_mother  --scale 0.60   把拉丁侧距收到 0.60 倍（唯一的设计性改动）
          #   fix_latin_kern --min-ink 34 把碰撞推回 >=34，只动已有的对
          # 汉字（advance 恒 1000 的全角字）在 slim_mother 里被 LATIN_MAX 挡住，
          # 一个都不碰；下面验收里的「汉字 advance 全为 1000」「纯平移」照旧成立。
          mkdir -p work/latin work/kern
          python tools/slim_mother.py "work/vpos/${MOTHER_NAME}" \
            -o "work/latin/${MOTHER_NAME}" --scale 0.60 | tee build/latin.md
          python tools/fix_latin_kern.py "work/latin/${MOTHER_NAME}" \
            -o "work/kern/${MOTHER_NAME}" --min-ink 34 | tee -a build/latin.md
          cp build/latin.md "$GITHUB_STEP_SUMMARY"
      - name: 去掉挂在字形外的碎块
        run: |
          set -euo pipefail
          # 母版在 5 个字外面各溅了一颗 8–9 点的碎块（日 论 攺 䐴 饦），屏幕上就是
          # 「日 右上角多一个小点」。判据：8–9 点 + 尺寸 30–80 单位 + 与最近轮廓的
          # 空隙 0.5–40 单位。全库扫描只有这 5 个命中，其它 33,884 个字形一个点不动。
          mkdir -p work/stray
          python tools/drop_stray_ring.py "work/kern/${MOTHER_NAME}" \
            -o "work/stray/${MOTHER_NAME}" | tee build/stray.md
          cp build/stray.md "$GITHUB_STEP_SUMMARY"
      - name: 取版本号（五段，不带 SHA）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 号源只有一处实现（tools/ci_version.py），当日号按当日运行数算。
          # 上一版这里写死 `--day 1`，于是同一天出多少个包当日号都是假的 1
          # （主人 2026-11-09 实查 build-26.11.9.1.367 / .368 发现），违 §14。
          VERSION=$(python3 tools/ci_version.py --workflow build.yml)
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "产物名 build-${VERSION}"
      - name: 出包（母版 + 水平/竖向定位修正）
        run: |
          set -euo pipefail
          # 五段 yy.m.d.当日号.总序号，全部来自上一步取号，不再自己拼日期。
          name="build-${VERSION}"
          # ★ 2026-11-27 诊断通道：CI 日志域名（results-receiver.actions.githubusercontent.com
          #   与 blob.core.windows.net）不在本会话沙箱白名单，run view --log 与 artifact
          #   内容都读不到，唯一能读到的是 check-runs 的 annotations。于是失败时把
          #   traceback 末 5 行和基包状态写成 ::error:: annotation，下次 failure 时
          #   `gh api .../check-runs/<id>/annotations` 就能拿到真因。
          #   背景：run 45698525799 failure 于本步骤，而我「cache 无 base.zip → 下载 EOF」
          #   的归因被 actions/caches 反证（fonts-v1-Linux 188 MB 含 base.zip），真因未知。
          if ! python build.py --passthrough-mother "work/stray/${MOTHER_NAME}" \
            --date "$(echo "$VERSION" | cut -d. -f1-3)" \
            --day "$(echo "$VERSION" | cut -d. -f4)" \
            --build "$(echo "$VERSION" | cut -d. -f5)" --module-id selffont-bench \
            --output "build/${name}.zip" 2>build/err.log; then
            tail -n 5 build/err.log | sed 's|^|::error file=.github/workflows/build.yml::|'
            python - <<'PY' || true
          import os, zipfile
          p = "build/cache/base.zip"
          if os.path.exists(p):
              z = zipfile.ZipFile(p)
              names = sorted(z.namelist())
              print(f"::error file=.github/workflows/build.yml::base.zip 存在 {os.path.getsize(p)} B "
                    f"{len(names)} 成员 前12={names[:12]}")
          else:
              print("::error file=.github/workflows/build.yml::base.zip 不存在（cache 未含）")
          PY
            exit 1
          fi
          echo "NAME=${name}" >> "$GITHUB_ENV"
      - name: 解包为可直刷目录
        run: |
          set -euo pipefail
          rm -rf build/root
          unzip -oq "build/${NAME}.zip" -d build/root
          test -f build/root/module.prop
          test -f build/root/customize.sh
          ver=$(sed -n 's/^version=//p' build/root/module.prop)
          # 取号器算出的版本与包内 module.prop 的 version 必须同一串：
          # 上一版这里直接覆盖 VERSION，产物名就跟着包内版本走，号源等于被绕过。
          test "$ver" = "$VERSION" || { echo "::error::包内 version=${ver} 与取号 ${VERSION} 不一致"; exit 1; }
          echo "产物名 build-${VERSION}"
      - name: 验收（纯平移、字宽不变、横竖墨心归位）
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee build/verify.md
          import hashlib, io, os, statistics, sys, traceback, zipfile
          from fontTools.ttLib import TTFont

          # 失败原因必须能读回来：沙箱拉不到 Actions 原始日志（blob.core.windows.net
          # 被挡），但 `::error::` 会进 check-runs 的 annotations，那条走 API 能读。
          # 不改脚本结构，只挂一个 excepthook，异常时把最后三行打成 annotation。
          def _report(exc_type, exc, tb):
              lines = traceback.format_exception(exc_type, exc, tb)
              tail = "".join(lines[-3:]).replace("\n", " | ")
              print(f"::error::{tail[:900]}", file=sys.stderr)
          sys.excepthook = _report

          name, mother = os.environ["NAME"], os.environ["MOTHER_NAME"]
          raw = open(f"build/{name}.zip", "rb").read()
          with zipfile.ZipFile(f"build/{name}.zip") as z:
              # 主字体进包时是**改名后的安装副本**（Selffont-…），不沿用母版原名：
              # 设备 /system/fonts 里可能本来就有同名文件，同名会让「哪份在跑」说不清。
              # 所以这里按「包里唯一那份带 Maruko 的字件」取，并断言行件名确实是安装名。
              _hits = [n for n in z.namelist()
                       if n.startswith("system/fonts/") and "Maruko" in n.rsplit("/", 1)[-1]]
              assert len(_hits) == 1, f"包里带 Maruko 的字件应该正好一份，实际 {_hits}"
              assert _hits[0].rsplit("/", 1)[-1].startswith("Selffont-"), \
                  f"安装副本没改名：{_hits[0]}（与母版原名相同会让设备上的同名文件互相顶掉）"
              packed = z.read(_hits[0])
              prop = z.read("module.prop").decode()
              fonts = [n for n in z.namelist() if n.startswith("system/fonts/")]

          # fixed_bytes 已无人读（行框归一之后整份字节本来就该不等），删掉免得留下死变量。
          # ★ hhea／typo 对齐设备空壳 930/−250，usWin 拿裁剪包络。
          #   verify_packaged_metrics 单源；内联只调不抄。
          import build
          build.verify_packaged_metrics(packed, os.path.join("work", mother))

          # ★ 2026-11-24 修正：基准必须留**原始母版**，不能换成 work/kern。
          #   下面几条断言查的是「汉字被 fix_hpos/fix_vpos 纯平移过、且墨心归位」，
          #   拿 already-修过定位的 kern 版当基准，`share(ca) > share(cb)` 必然相等→必红。
          #   拉丁被 slim_mother 缩过侧距不影响这些断言：循环里 `if not cjk(cp): continue`，
          #   只查汉字；汉字在 slim_mother 里被 LATIN_MAX 挡住，一个点都没动。
          before = TTFont(os.path.join("work", mother))
          after = TTFont(io.BytesIO(packed))
          cmap = before.getBestCmap()
          gb, ga = before["glyf"], after["glyf"]
          hb, ha = before["hmtx"], after["hmtx"]

          def cjk(cp): return 0x4E00 <= cp <= 0x9FFF or 0x3400 <= cp <= 0x4DBF

          # ★ 2026-11-24：这 5 个字的轮廓**故意**变了（删掉母版溅在字形外的碎块，
          #   见 tools/drop_stray_ring.py）。它们是已知的、逐一核实过的例外，
          #   必须在这里点名，不能把判据整体放松 —— 否则「不许改形状」就形同虚设。
          # ★ 2026-11-27 追加 15 个：drop_stray_ring 新增「分支二」判据（整条轮廓落在
          #   字身框外 + 尺寸 30–80 + 占比 ≤2%）后全库命中。主人指出「谚」左下角那颗；
          #   同判据扫出同类 14 个。其中 12 个删碎块后整体 bbox 不变（dx=dy=0，本断言
          #   不触发），㓰/锂/鶌 三个 yMin 会抬 8/31/5 单位而触发，故 15 个全部点名。
          # ★ 名单用**码位字面量**写，不写汉字字面：扩展 A 生僻字在编辑传输中两次
          #   丢失成空字符串（19 元素、断言在 U+4434 上炸三次）。码位是 ASCII 不会丢。
          STRAY_DROPPED = {chr(c) for c in (
              0x65E5, 0x8BBA, 0x653A, 0x4434, 0x9966,
              0x34F0, 0x3B35, 0x3BA3, 0x497B, 0x58AB,
              0x5DFD, 0x6300, 0x698B, 0x7468, 0x7506,
              0x8B1C, 0x8C1A, 0x94BE, 0x9502, 0x9D8C)}
          # ★ 2026-11-27 真因闭环（check-runs annotations 读到的 AssertionError）：
          #   上一版名单在编辑时漏掉 䐴  㮣  甆 五字（写成空字符串），于是
          #   run 45732170513 / 45733198357 / 45734332009 连续三次死在
          #   「U+4434 的点数从 230 变成 221，且不在已批准的碎块清理名单里」。
          #   空字符串进集合不报错、只让断言在真机字上炸 —— 与 DEVICE_PROVIDED_FONTS
          #   空集合是同一类事故（声明与内容不符）。此后名单改动必须跑下面的本地核对。
          assert len(STRAY_DROPPED) == 20 and "" not in STRAY_DROPPED, "碎块名单漏字或含空串"
          _cp2ch = {v: chr(k) for k, v in cmap.items()}

          moved = bad_shift = bad_adv = 0
          for cp, gname in cmap.items():
              if not cjk(cp):
                  continue
              b, a = gb[gname], ga[gname]
              if b.numberOfContours <= 0:
                  continue
              dx = round(a.xMin - b.xMin)
              dy = round(a.yMin - b.yMin)
              if dx or dy:
                  moved += 1
                  if len(b.coordinates) != len(a.coordinates):
                      # 点数变了只允许出现在上面那 5 个点名例子里
                      assert _cp2ch.get(gname) in STRAY_DROPPED, (
                          f"U+{cp:04X} 的点数从 {len(b.coordinates)} 变成 "
                          f"{len(a.coordinates)}，且不在已批准的碎块清理名单里")
                      continue
              if dx or dy:
                  deltas = {(round(ax - bx), round(ay - by))
                            for (bx, by), (ax, ay) in zip(b.coordinates, a.coordinates)}
                  if deltas - {(dx, dy)}:
                      bad_shift += 1
              if hb[gname][0] != ha[gname][0]:
                  bad_adv += 1
          assert bad_shift == 0, f"{bad_shift} 个字的点位移不相等（不是纯平移）"
          assert bad_adv == 0, f"{bad_adv} 个字的 advance 变了"

          cjk_glyphs = [cmap[cp] for cp in cmap if cjk(cp)]
          advs = {ha[g][0] for g in cjk_glyphs}
          assert advs == {1000}, f"汉字 advance 不再全是 1000：{sorted(advs)[:5]}"
          lsb_bad = sum(1 for g in cjk_glyphs
                        if ga[g].numberOfContours > 0 and ha[g][1] != ga[g].xMin)
          assert lsb_bad == 0, f"lsb ≠ xMin 的字 {lsb_bad} 个"

          def centres(font):
              out = []
              for cp, gname in font.getBestCmap().items():
                  if not cjk(cp):
                      continue
                  g = font["glyf"][gname]
                  if g.numberOfContours > 0 and g.xMax - g.xMin >= 850:
                      out.append((g.xMin + g.xMax) / 2 - 500)
              return out

          cb, ca = centres(before), centres(after)
          # 满格字是按「墨宽 >= 850」筛的。`攺` 删掉左侧那颗碎块后宽度 917 → 849，
          # 刚好掉出门槛，所以计数允许少 1 —— 但必须点名是哪几个字，
          # 不许写成「允许差几个」这种含糊判据。
          assert len(cb) - len(STRAY_DROPPED) <= len(ca) <= len(cb), (
              f"满格字数量从 {len(cb)} 变成 {len(ca)}，超出碎块清理能解释的范围"
              f"（最多允许少 {len(STRAY_DROPPED)} 个）")

          def share(values, limit=20):
              return 100 * sum(1 for v in values if abs(v) <= limit) / len(values)

          assert share(ca) >= 99.5, f"修完满格字 |dcx|≤20 只有 {share(ca):.2f}%"
          assert share(ca) > share(cb), "修完反而更偏"

          def vcentres(font):
              out = []
              for cp, gname in font.getBestCmap().items():
                  if not cjk(cp):
                      continue
                  g = font["glyf"][gname]
                  if g.numberOfContours > 0 and g.xMax - g.xMin >= 850 and g.yMax - g.yMin >= 850:
                      out.append((g.yMin + g.yMax) / 2)
              return out

          vb, va = vcentres(before), vcentres(after)
          # 同上：满宽满高也是按墨宽 ≥ 850 筛的，`攺` 删碎块后掉出门槛，计数会少。
          # 允许范围的上限就是点名例外的个数，不写含糊判据。
          assert len(vb) - len(STRAY_DROPPED) <= len(va) <= len(vb), (
              f"满宽满高字数量从 {len(vb)} 变成 {len(va)}，超出碎块清理能解释的范围"
              f"（最多允许少 {len(STRAY_DROPPED)} 个）")
          mid = statistics.median(vb)
          dvb = [abs(v - mid) for v in vb]
          dva = [abs(v - mid) for v in va]
          vshare = lambda v: 100 * sum(1 for x in v if x <= 20) / len(v)
          assert vshare(dva) >= 99.0, f"修完满宽满高字 |dcy|≤20 只有 {vshare(dva):.2f}%"
          assert vshare(dva) > vshare(dvb), "竖向修完反而更偏"

          fields = dict(l.split("=", 1) for l in prop.splitlines() if "=" in l)
          print("\n".join([
              "| 项 | 值 |", "| --- | --- |",
              f"| 包 | `{name}.zip` |",
              f"| 包 sha256 | `{hashlib.sha256(raw).hexdigest()}` |",
              f"| 包大小 | {len(raw):,} B |",
              f"| 版本 | `{fields.get('version')}`（versionCode {fields.get('versionCode')}） |",
              f"| 汉字字件 | `{_hits[0].rsplit('/', 1)[-1]}` {len(packed):,} B（母版 {mother} → 只平移过的字节） |",
              f"| 平移过的字 | {moved:,} 个，逐字 (dx,dy) 处处相等（纯平移） |",
              f"| advance / lsb | 全 1000 / lsb==xMin 0 例外 |",
              f"| 满格字墨心 \\|dcx\\|≤20 | {share(cb):.2f}% → **{share(ca):.2f}%** |",
              f"| 满格字墨心 中位 \\|dcx\\| | {statistics.median(map(abs, cb)):.1f} → **{statistics.median(map(abs, ca)):.1f}** |",
              f"| 满格字墨心 最大 \\|dcx\\| | {max(map(abs, cb)):.1f} → **{max(map(abs, ca)):.1f}** |",
              f"| 满宽满高字 \\|dcy\\|≤20 | {vshare(dvb):.2f}% → **{vshare(dva):.2f}%** |",
              f"| 满宽满高字 中位 \\|dcy\\| | {statistics.median(dvb):.1f} → **{statistics.median(dva):.1f}** |",
              f"| 满宽满高字 最大 \\|dcy\\| | {max(dvb):.1f} → **{max(dva):.1f}** |",
              f"| 包内 /system/fonts 字件 | {len(fonts)} 个 |",
          ]))
          PY
          cp build/verify.md "$GITHUB_STEP_SUMMARY"
      - name: 失败时回传验收输出
        if: failure()
        run: |
          set -euo pipefail
          # 沙箱里拉不到 Actions 原始日志（被 blob.core.windows.net 挡住），
          # 所以失败时把验收的输出贴进 step summary，走 API 能读回来。
          if [ -f build/verify.md ]; then
            { echo '## 验收失败输出'; echo '```'; tail -c 6000 build/verify.md; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo '验收脚本没产出 build/verify.md（死在更早的步骤）' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 上传母版模块
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ env.VERSION }}
          path: build/root
          retention-days: 5
          if-no-files-found: error
          overwrite: true

  cleanup-artifacts:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
      - name: 清理超限产物与运行记录
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CLEANUP_SCOPE: actions
