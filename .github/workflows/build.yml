name: Build Selffont
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read          # 只为读本工作流的运行历史算版本号,不写
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  module:
    name: Checks (selfcheck + build verification)
    runs-on: ubuntu-24.04   # 钉住版本,不用 ubuntu-latest(它的迁移提示会一直挂着)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install fonttools
        run: python -m pip install -r requirements.txt
      - name: Selfcheck (packager, metric normalization, module scripts)
        run: python build.py --check
      # 校验性构建:版本号在这一处算定(build.py --query-github 现场查本工作流的运行历史),
      # 产物名跟着版本走。CI 不发版、不上传 artifact——zip 随 runner 丢弃,模块 zip 由本地 build.py 产出。
      - name: Build verification (no artifacts, version stamped)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python build.py --query-github
