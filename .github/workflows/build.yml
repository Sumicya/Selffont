name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  module:
    name: Checks (selfcheck + build verification)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install fonttools
        run: python -m pip install -r requirements.txt
      - name: Selfcheck (packager, metric normalization, module scripts)
        run: python build.py --check
      - name: Build (version stamped)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python build.py --query-github
      # 非 PR 运行把 zip 传成 Actions artifact(规范认可的真实下载入口;上传不需要写权限),
      # 名 = <项目名>-<版本>,留 5 天兜底;PR 运行只校验,不发版、不写 Release。
      - name: Stage module zip name (non-PR)
        if: github.event_name != 'pull_request'
        run: |
          zip_file=$(basename "$(find build -maxdepth 1 -name 'Selffont*.zip' -print -quit)")
          test -n "$zip_file"
          ls -l "build/$zip_file"
          echo "MODULE_ZIP=${zip_file%.zip}" >> "$GITHUB_ENV"
      - name: Upload module zip (non-PR)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MODULE_ZIP }}
          path: build/Selffont*.zip
          retention-days: 5
          if-no-files-found: error
