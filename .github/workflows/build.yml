# 出包工作流：每次出母版 Magisk 模块 build-* 与 selfrounds 字体；手动勾 selffont 才出自研模块。不发 Release、不打 tag。
name: build

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'bad/**'
      - 'lsp/**'          # LSPosed 模块在 hotswap.yml 里编，字体 job 不跟着跑
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      full:
        description: '跑全量构建（默认 true；push 时一律只出预览子集）'
        type: boolean
        default: true
      selffont:
        description: '出 selffont 模块（自研字体还不合格，默认关；关时只发 selfrounds 字体）'
        type: boolean
        default: false

env:
  SEGMENTS: '5'
  CLEANUP_APPLY: 'true'
  # 母版来源钉死：CJK SC 的 Regular，20,084,736 B，sha256 与 docs/metrics.md 同一份。
  MOTHER_SHA256: 'e3709389bce13fa75af28cc2370b6175520d97f74dfbf3894ca24838f47241b7'
  MOTHER_NAME: 'MarukoGothicCJKsc-Regular.ttf'
  MOTHER_REF: '97e9dd4'

concurrency:
  group: selffont-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      statuses: write   # 失败时把 build.log 最后一行写进 commit status（日志宿主取不到）
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: 恢复 pip 缓存
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-
      - name: 恢复字体缓存
        uses: actions/cache@v5
        with:
          path: build/cache
          key: fonts-v1-${{ runner.os }}
          restore-keys: fonts-v1-
      - name: 安装字体工具
        run: python -m pip install -r requirements.txt
      - name: 内建自检
        run: python build.py --check
      - name: 判断构建模式
        id: mode
        run: |
          # selffont 模块（自研字体）默认不出：主人 2026-11-05「字体太过垃圾所以不搞」。
          # 只有手动触发且勾了 selffont 才走全量出模块这条；push 永远只发 selfrounds 字体。
          if { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full }}" = "true" ] \
               && [ "${{ inputs.selffont }}" = "true" ]; } \
             || printf '%s' "${{ github.event.head_commit.message }}" | grep -q '\[selffont\]'; then
            echo "full=1" >> "$GITHUB_OUTPUT"
            echo "全量构建（selffont 模块）"
          else
            echo "full=0" >> "$GITHUB_OUTPUT"
            echo "只发 selfrounds 字体（预览子集，不出模块）"
          fi
      - name: 预览出包
        if: steps.mode.outputs.full != '1'
        run: |
          echo "SHA8=${GITHUB_SHA::8}" >> "$GITHUB_ENV"
          python build.py --preview '鬱響鬢Ay?' --preview-out build/preview
      - name: 取号并出包
        if: steps.mode.outputs.full == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          python build.py --query-ci 2>&1 | tee build.log
      - name: 失败时把日志尾巴报成注解
        if: failure()
        # 摘要页那块在 GitHub 页面上是「### Uh oh! There was an error while loading」，读不到；
        # 注解（::error::）在运行页的 Annotations 里直接显示，能抓下来。多行拼成一条注解会被
        # 页面截成一句，所以逐行发（最多 10 条）；异常那一行另发一条 commit status，
        # description 有 140 字，正好装得下。
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ ! -f build.log ]; then
            echo "::error title=build.log::没有 build.log"
            exit 0
          fi
          tail -n 6 build.log | while IFS= read -r line; do
            echo "::error title=build.log::${line}"
          done
          desc=$(tail -n 1 build.log | cut -c1-120)
          gh api -X POST "repos/${REPO}/statuses/${GITHUB_SHA}" \
            -f state=failure -f context=build-log -f description="$desc" >/dev/null || true
      - name: 失败时把日志写进运行摘要
        if: failure()
        # 运行日志本体走 results-receiver / blob.core.windows.net，本机取不到（握手 EOF），
        # 产物里的 build-log 也一样要过同一个域名。摘要走的是页面 HTML，能直接读，
        # 所以失败时把日志尾巴抄一份到摘要里——不然只知道「exit 1」，不知道为什么。
        run: |
          {
            echo '### build.log 末尾 120 行'
            echo '```'
            if [ -f build.log ]; then tail -n 120 build.log; else echo '（没有 build.log）'; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 失败时上传构建日志
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ github.run_id }}
          path: build.log
          retention-days: 2
          if-no-files-found: error
          overwrite: true
      - name: 确认产物名
        if: steps.mode.outputs.full == '1'
        run: |
          zip_file=$(basename "$(find build -maxdepth 1 -name 'Selffont-*.zip' -print -quit)")
          test -n "$zip_file"
          name="${zip_file%.zip}"
          echo "$name" | grep -Eq '^Selffont-[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}\.[0-9]+\.[0-9]+$' || {
            echo "产物名不是五段规范版本：$name" >&2
            exit 1
          }
          echo "ARTIFACT_NAME=$name" >> "$GITHUB_ENV"
          echo "VERSION=${name#Selffont-}" >> "$GITHUB_ENV"
      - name: 解包为可直刷目录
        if: steps.mode.outputs.full == '1'
        run: |
          rm -rf build/root
          unzip -oq "build/${ARTIFACT_NAME}.zip" -d build/root
          test -f build/root/module.prop
          test -f build/root/customize.sh
      - name: 记录产物哈希
        if: steps.mode.outputs.full == '1'
        id: sha
        run: |
          sum=$(sha256sum "build/${ARTIFACT_NAME}.zip" | cut -d' ' -f1)
          echo "$sum  ${ARTIFACT_NAME}.zip" > build/SHA256SUMS.txt
          cp build/SHA256SUMS.txt build/root/SHA256SUMS.txt
          echo "sum=$sum" >> "$GITHUB_OUTPUT"
          echo "sum8=${sum:0:8}" >> "$GITHUB_OUTPUT"
          echo "sha256=$sum  ${ARTIFACT_NAME}.zip"
      - name: 上传正式产物
        if: steps.mode.outputs.full == '1'
        uses: actions/upload-artifact@v7
        with:
          # 三类产物各用一个固定前缀，别混（主人第五次强调）：
          #   build      → 母版 Magisk 模块（同文件的 pack job，可直刷）
          #   selffont   → 自研字体 Magisk 模块（本行；默认关，字体不合格）
          #   selfrounds → Selfrounds 字体本身（下面那一处）
          name: selffont-${{ env.VERSION }}
          path: build/root
          retention-days: 5
          if-no-files-found: error
          overwrite: true
      - name: 上传哈希
        if: steps.mode.outputs.full == '1'
        uses: actions/upload-artifact@v7
        with:
          name: selffont-sha256-${{ steps.sha.outputs.sum8 }}
          path: build/SHA256SUMS.txt
          retention-days: 5
          if-no-files-found: error
          overwrite: true
      - name: 上传预览产物
        if: steps.mode.outputs.full != '1'
        uses: actions/upload-artifact@v7
        with:
          name: selfrounds-${{ env.SHA8 }}
          path: build/preview
          retention-days: 3
          if-no-files-found: error
          overwrite: true

  # 母版 Magisk 模块：母版原字节直接进模块，只做挂载与配置，不改一个轮廓。
  # 与上面的 build job 并行（互不 needs），push 一次两个 job 同时起跑。
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read         # 只出 artifact，不发 Release、不打 tag、不改 latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: 安装字体工具
        run: python -m pip install -r requirements.txt
      - name: 内建自检
        run: python build.py --check
      - name: 取自母版原始字节
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work
          gh api "repos/max32002/maruko-gothic/contents/CJK%20SC/${MOTHER_NAME}?ref=${MOTHER_REF}" \
            -H "Accept: application/vnd.github.raw" > "work/${MOTHER_NAME}"
          sum=$(sha256sum "work/${MOTHER_NAME}" | cut -d' ' -f1)
          echo "尺寸 $(stat -c%s "work/${MOTHER_NAME}") B  sha256 $sum"
          [ "$sum" = "$MOTHER_SHA256" ] || {
            echo "母版字节与钉子不符：母版可能已换包，先核对再出包。" >&2
            exit 1
          }
      - name: 出包（母版直通）
        run: |
          set -euo pipefail
          date=$(TZ=Asia/Shanghai date +%y.%-m.%-d)
          name="build-${MOTHER_REF}-${{ github.run_number }}"
          python build.py --passthrough-mother "work/${MOTHER_NAME}" \
            --date "$date" --day 1 --build "${{ github.run_number }}" --module-id selffont-bench \
            --output "build/${name}.zip"
          echo "NAME=${name}" >> "$GITHUB_ENV"
      - name: 解包为可直刷目录
        run: |
          set -euo pipefail
          rm -rf build/root
          unzip -oq "build/${NAME}.zip" -d build/root
          test -f build/root/module.prop
          test -f build/root/customize.sh
          # artifact 下下来就是模块 zip：module.prop 必须在根目录，不能「zip 里套 zip」，
          # 所以上传解开的目录内容，而不是 build/${NAME}.zip。
          ver=$(sed -n 's/^version=//p' build/root/module.prop)
          echo "VERSION=${ver}" >> "$GITHUB_ENV"
          echo "产物名 build-${ver}"
      - name: 验收母版字节
        run: |
          set -euo pipefail
          python - <<'PY' | tee build/verify.md
          import hashlib, os, zipfile

          name, mother = os.environ["NAME"], os.environ["MOTHER_NAME"]
          raw = open(f"build/{name}.zip", "rb").read()
          with zipfile.ZipFile(f"build/{name}.zip") as z:
              cjk = z.read(f"system/fonts/{mother}")
              prop = z.read("module.prop").decode()
              fonts = [n for n in z.namelist() if n.startswith("system/fonts/")]
          got = hashlib.sha256(cjk).hexdigest()
          want = os.environ["MOTHER_SHA256"]
          assert got == want, f"包内汉字字件不是母版原字节：{got}"
          assert len(cjk) == 20084736, len(cjk)
          fields = dict(l.split("=", 1) for l in prop.splitlines() if "=" in l)
          print("\n".join([
              "| 项 | 值 |", "| --- | --- |",
              f"| 包 | `{name}.zip` |",
              f"| 包 sha256 | `{hashlib.sha256(raw).hexdigest()}` |",
              f"| 包大小 | {len(raw):,} B |",
              f"| 版本 | `{fields.get('version')}`（versionCode {fields.get('versionCode')}） |",
              f"| 汉字字件 | `{mother}` {len(cjk):,} B，与母版原字节一致 |",
              f"| 包内 /system/fonts 字件 | {len(fonts)} 个 |",
          ]))
          PY
          cp build/verify.md "$GITHUB_STEP_SUMMARY"
      - name: 上传母版模块
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ env.VERSION }}
          path: build/root
          retention-days: 30
          if-no-files-found: error
          overwrite: true

  cleanup-artifacts:
    needs: [build, pack]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
      - name: 清理超限产物与运行记录
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CLEANUP_SCOPE: actions
        run: python3 .github/scripts/cleanup.py

  cleanup-releases:
    needs: [build, pack]
    if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 清理多余 Release 与孤立 tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CLEANUP_SCOPE: releases
        run: python3 .github/scripts/cleanup.py
