name: Build Selffont
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write   # 直出 release 需要
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  module:
    name: Font module (KSU zip)
    runs-on: ubuntu-24.04   # 钉住版本,不用 ubuntu-latest(它的迁移提示会一直挂着)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install fonttools
        run: python -m pip install -r requirements.txt
      - name: Selfcheck (packager, metric normalization, module scripts)
        run: python build.py --check
      - name: Build module (stamp version = vYY.M.D.<run number>)
        env:
          SELFFONT_BUILD: ${{ github.run_number }}   # 总构建数:versionCode 就是它
        run: python build.py
      # 直出:release 附件就是裸 zip,无 sha256 边车、无 artifact 的二次打包(下载即装)。
      # PR 事件没有写权限,只构建校验不发版。
      - name: Ship (release 直出)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(unzip -p build/Selffont.zip module.prop | sed -n 's/^version=//p')
          gh release create "$tag" build/Selffont.zip --title "$tag" --notes "$tag" --latest \
            || gh release upload "$tag" build/Selffont.zip --clobber
