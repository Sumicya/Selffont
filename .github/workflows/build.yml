# 出包工作流：push（不限分支）与手动触发，出 Selffont-<版本> 模块包并清理超限产物与运行记录。
name: Build

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'bad/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      full:
        description: '跑全量构建（默认 true；push 时一律只出预览子集）'
        type: boolean
        default: true

env:
  SEGMENTS: '5'
  CLEANUP_APPLY: 'true'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: 恢复 pip 缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-
      - name: 恢复字体缓存
        uses: actions/cache@v4
        with:
          path: build/cache
          key: fonts-v1-${{ runner.os }}
          restore-keys: fonts-v1-
      - name: 安装字体工具
        run: python -m pip install -r requirements.txt
      - name: 内建自检
        run: python build.py --check
      - name: 判断构建模式
        id: mode
        run: |
          if { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full }}" = "true" ]; } \
             || printf '%s' "${{ github.event.head_commit.message }}" | grep -q '\[full\]'; then
            echo "full=1" >> "$GITHUB_OUTPUT"
            echo "全量构建（正式版本）"
          else
            echo "full=0" >> "$GITHUB_OUTPUT"
            echo "预览子集构建（改字形用，不跑 53 分钟的全量）"
          fi
      - name: 预览出包
        if: steps.mode.outputs.full != '1'
        run: python build.py --preview '鬱響鬢Ay?' --preview-out build/preview
      - name: 取号并出包
        if: steps.mode.outputs.full == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          python build.py --query-ci 2>&1 | tee build.log
      - name: 失败时上传构建日志
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ github.run_id }}
          path: build.log
          retention-days: 2
          if-no-files-found: ignore
      - name: 确认产物名
        if: steps.mode.outputs.full == '1'
        run: |
          zip_file=$(basename "$(find build -maxdepth 1 -name 'Selffont-*.zip' -print -quit)")
          test -n "$zip_file"
          name="${zip_file%.zip}"
          echo "$name" | grep -Eq '^Selffont-[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}\.[0-9]+\.[0-9]+$' || {
            echo "产物名不是五段规范版本：$name" >&2
            exit 1
          }
          echo "ARTIFACT_NAME=$name" >> "$GITHUB_ENV"
      - name: 解包为可直刷目录
        if: steps.mode.outputs.full == '1'
        run: |
          rm -rf build/root
          unzip -oq "build/${ARTIFACT_NAME}.zip" -d build/root
          test -f build/root/module.prop
          test -f build/root/customize.sh
      - name: 记录产物哈希
        if: steps.mode.outputs.full == '1'
        id: sha
        run: |
          sum=$(sha256sum "build/${ARTIFACT_NAME}.zip" | cut -d' ' -f1)
          echo "$sum  ${ARTIFACT_NAME}.zip" > build/SHA256SUMS.txt
          cp build/SHA256SUMS.txt build/root/SHA256SUMS.txt
          echo "sum=$sum" >> "$GITHUB_OUTPUT"
          echo "sha256=$sum  ${ARTIFACT_NAME}.zip"
      - name: 上传正式产物
        if: steps.mode.outputs.full == '1'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: build/root
          retention-days: 5
          if-no-files-found: error
          overwrite: true
      - name: 上传哈希
        if: steps.mode.outputs.full == '1'
        uses: actions/upload-artifact@v7
        with:
          name: Selffont-preview-sha256-${{ steps.sha.outputs.sum }}
          path: build/SHA256SUMS.txt
          retention-days: 5
          if-no-files-found: error
          overwrite: true
      - name: 上传预览产物
        if: steps.mode.outputs.full != '1'
        uses: actions/upload-artifact@v7
        with:
          name: Selffont-preview-${{ github.sha }}
          path: build/preview
          retention-days: 3
          if-no-files-found: error
          overwrite: true

  publish:
    needs: build
    if: contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: 找最新的全量产物
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          row=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --jq '
            [.artifacts[] | select(.expired==false)
             | select(.name|test("^Selffont-[0-9]{1,2}\\.[0-9]{1,2}\\.[0-9]{1,2}\\.[0-9]+\\.[0-9]+$"))]
            | sort_by(.created_at) | last | "\(.workflow_run.id) \(.name)"')
          test -n "$row"
          echo "run=${row%% *}" >> "$GITHUB_OUTPUT"
          echo "name=${row#* }" >> "$GITHUB_OUTPUT"
      - name: 下载直刷目录并重新打包
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ steps.pick.outputs.run }}" -n "${{ steps.pick.outputs.name }}" -D dist
          test -f dist/module.prop
          (cd dist && zip -qr "../${{ steps.pick.outputs.name }}.zip" .)
          sha256sum "${{ steps.pick.outputs.name }}.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: 发 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="${{ steps.pick.outputs.name }}"
          version="${name#Selffont-}"
          gh release create "v$version" "$name.zip" SHA256SUMS.txt \
            --title "Selffont $version" \
            --notes "Magisk / KernelSU：管理器里「从本地安装」选 zip → 重启。sha256 见 SHA256SUMS.txt。"

  cleanup-artifacts:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    concurrency:
      group: selffont-cleanup
      cancel-in-progress: false
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
      - name: 清理超限产物与运行记录
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CLEANUP_SCOPE: actions
        run: python3 .github/scripts/cleanup.py

  cleanup-releases:
    needs: build
    if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: selffont-cleanup
      cancel-in-progress: false
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 清理多余 Release 与孤立 tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CLEANUP_SCOPE: releases
        run: python3 .github/scripts/cleanup.py
