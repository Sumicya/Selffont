name: Build Selffont
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  module:
    name: Checks (selfcheck + build verification)
    runs-on: ubuntu-24.04   # 钉住版本,不用 ubuntu-latest(它的迁移提示会一直挂着)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install fonttools
        run: python -m pip install -r requirements.txt
      - name: Selfcheck (packager, metric normalization, module scripts)
        run: python build.py --check
      # 校验性构建:流水线必须能跑通,但 CI 不发版、不出产物——
      # 模块 zip 由本地 build.py 产出。这里只验证,产物随 runner 丢弃。
      - name: Build verification (no artifacts)
        run: python build.py --output /tmp/Selffont.zip
