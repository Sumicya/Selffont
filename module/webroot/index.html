<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selffont</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #101418; color: #e6e6e6; }
  main { max-width: 480px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 4px 0 12px; }
  p { color: #9aa3ab; font-size: 14px; line-height: 1.6; }
  button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #2c343c; border-radius: 10px;
           background: #1a2129; color: #e6e6e6; font-size: 15px; }
  button:disabled { opacity: .4; }
  pre { background: #0b0e11; border: 1px solid #232a31; border-radius: 10px; padding: 12px;
        font-size: 12px; white-space: pre-wrap; word-break: break-all; min-height: 96px; }
</style>
</head>
<body>
<main>
  <h1>Selffont</h1>
  <p>系统字体由 fonts.xml 原生挂载,重启生效。本页只做只读诊断;应用内字体替换由 LSPosed 作用域决定。</p>
  <button id="run">只读诊断</button>
  <pre id="out">尚未执行。</pre>
</main>
<script>
  const out = document.getElementById('out');
  const run = document.getElementById('run');
  const log = text => { out.textContent += text + '\n'; };
  const SCRIPT = 'sh /data/adb/modules/MFGA/action.sh diagnose';

  // KernelSU 桥:ksu.exec(command, options, callbackName) 回调 window[callbackName](errno, stdout, stderr)。
  // errno 是唯一成功契约;命令执行成功不等于字体渲染正确。
  let callbackId = 0;
  const exec = command => new Promise((resolve, reject) => {
    if (typeof window.ksu === 'undefined') { reject(new Error('KernelSU 桥不可用(浏览器预览?)')); return; }
    const name = `selffont_exec_${Date.now()}_${callbackId++}`;
    window[name] = (errno, stdout, stderr) => {
      delete window[name];
      if (!Number.isInteger(errno)) { reject(new TypeError('missing errno')); return; }
      resolve({ errno, stdout: String(stdout ?? ''), stderr: String(stderr ?? '') });
    };
    try { window.ksu.exec(command, '{}', name); }
    catch (error) { delete window[name]; reject(error); }
  });

  run.addEventListener('click', async () => {
    run.disabled = true;
    out.textContent = '';
    log('> ' + SCRIPT);
    try {
      const result = await exec(SCRIPT);
      if (result.stdout) log(result.stdout.trimEnd());
      if (result.stderr) log(result.stderr.trimEnd());
      log(`[${result.errno === 0 ? '完成' : '失败'}] exit=${result.errno}`);
    } catch (error) { log('[失败] ' + error); }
    run.disabled = false;
  });
</script>
</body>
</html>
